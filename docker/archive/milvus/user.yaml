# ── Storage ──────────────────────────────────────────────────────────────────
localStorage:
  path: /inspire/qb-ilm/project/multi-agent/niexiaohang-25130061/academic-data/milvus-data/storage

rocksmq:
  path: /inspire/qb-ilm/project/multi-agent/niexiaohang-25130061/academic-data/milvus-data/storage/rocksmq

# ── Memory Protection — safe margin for 79M chunks ────────────────────────────
quotaAndLimits:
  limitWriting:
    memProtection:
      queryNodeMemoryHighWaterLevel: 0.85
      dataNodeMemoryHighWaterLevel: 0.85

# ── MMAP — ON for arxiv_papers (HNSW, 3.3M vectors), OFF for arxiv_chunks ────
# IVF_PQ (79M, 5.4 GB) fits entirely in RAM — no mmap needed.
# arxiv_papers (HNSW, ~25 GB) uses mmap via env vars; per-collection
# disable for arxiv_chunks at application level.
queryNode:
  mmap:
    mmapDirPath: /inspire/qb-ilm/project/multi-agent/niexiaohang-25130061/academic-data/milvus-data/mmap
    vectorField: true
    vectorIndex: true
    maxDiskUsagePercentageForMmapAlloc: 50

# ── Standalone optimisation — local function calls, no gRPC ───────────────────
common:
  localRPCEnabled: true

# ── Segment compaction — reduce 880 segments for reconciliation storm ──────────
dataCoord:
  segment:
    maxSize: 4096
