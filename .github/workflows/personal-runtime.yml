name: Deploy or roll back production Scholight

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Prepare a change set, execute its reviewed ARN, or migrate Scholight
        type: choice
        required: true
        options: [plan, apply, migrate]
      release_manifest_key:
        description: Immutable S3 release manifest key for plan and apply
        type: string
        required: false
      change_set:
        description: Exact personal-runtime change set ARN for apply
        type: string
        required: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: scholight-personal-runtime
  cancel-in-progress: false

jobs:
  operate:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    environment: ${{ inputs.operation == 'migrate' && 'personal-database' || 'personal-infrastructure' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require main
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_CONTROL_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: '669409472143'
      - name: Execute the selected guarded operation
        env:
          OPERATION: ${{ inputs.operation }}
          CHANGE_SET: ${{ inputs.change_set }}
          MANIFEST_KEY: ${{ inputs.release_manifest_key }}
          EXPECTED_ACCOUNT_ID: '669409472143'
          AWS_REGION: ${{ vars.AWS_REGION }}
          CLOUDFORMATION_ROLE_ARN: ${{ vars.CLOUDFORMATION_ROLE_ARN }}
          ECS_CLUSTER_ARN: ${{ vars.ECS_CLUSTER_ARN }}
        run: |
          umask 077
          args=("$OPERATION")
          if [ "$OPERATION" != migrate ]; then
            args+=(--manifest-key "$MANIFEST_KEY")
          fi
          if [ "$OPERATION" = apply ]; then
            args+=(--change-set "$CHANGE_SET")
          fi
          uv run --no-project --with boto3==1.43.61 python scripts/personal_apply.py "${args[@]}"
