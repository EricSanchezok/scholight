name: Publish production images manually

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit already merged into main
        required: false
        default: main
        type: string

      architecture:
        description: Native image architecture
        required: true
        default: arm64
        type: choice
        options: [arm64, amd64]

permissions:
  contents: read
  id-token: write

concurrency:
  group: scholight-personal-image-publish-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.revision.outputs.release_sha }}
    steps:
      - name: Check out release revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve and validate immutable revision
        id: revision
        run: |
          test "$GITHUB_REF" = refs/heads/main
          release_sha=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$release_sha" origin/main
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

  quality:
    if: github.event_name == 'workflow_dispatch'
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.release_sha }}
    secrets:
      IDENTITY_READER_PRIVATE_KEY: ${{ secrets.IDENTITY_READER_PRIVATE_KEY }}

  publish:
    needs: [prepare, quality]
    runs-on: ${{ inputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    environment: personal-image-publish
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Validate personal target configuration
        env:
          REGION: ${{ vars.AWS_REGION }}
          ROLE: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          API_REPO: ${{ vars.ECR_API_REPOSITORY }}
          WEB_REPO: ${{ vars.ECR_WEB_REPOSITORY }}
          EXTRACT_REPO: ${{ vars.ECR_EXTRACT_REPOSITORY }}
          METADATA_REPO: ${{ vars.ECR_METADATA_REPOSITORY }}
          INGEST_REPO: ${{ vars.ECR_INGEST_REPOSITORY }}
        run: |
          test "$REGION" = ap-south-2
          [[ "$ROLE" == arn:aws:iam::669409472143:role/* ]]
          for repository in "$API_REPO" "$WEB_REPO" "$EXTRACT_REPO" "$METADATA_REPO" "$INGEST_REPO"; do
            [[ "$repository" =~ ^[a-z0-9][a-z0-9_./-]+$ ]]
          done
      - name: Mint read-only Identity token
        id: identity-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.IDENTITY_READER_APP_ID }}
          private-key: ${{ secrets.IDENTITY_READER_PRIVATE_KEY }}
          owner: EricSanchezok
          repositories: sanchezcloud-identity
          permission-contents: read
      - name: Assume personal image publisher
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: '669409472143'
      - uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2
        id: ecr
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Publish api
        id: api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/scholight-api/Dockerfile
          push: true
          platforms: linux/${{ inputs.architecture }}
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_API_REPOSITORY }}:git-${{ needs.prepare.outputs.release_sha }}-${{ inputs.architecture }}
          provenance: mode=max
          sbom: true
          target: api
          secrets: |
            github_token=${{ steps.identity-token.outputs.token }}
      - name: Publish metadata
        id: metadata
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/scholight-api/Dockerfile
          push: true
          platforms: linux/${{ inputs.architecture }}
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_METADATA_REPOSITORY }}:git-${{ needs.prepare.outputs.release_sha }}-${{ inputs.architecture }}
          provenance: mode=max
          sbom: true
          target: metadata
      - name: Publish ingest
        id: ingest
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/scholight-api/Dockerfile
          push: true
          platforms: linux/${{ inputs.architecture }}
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_INGEST_REPOSITORY }}:git-${{ needs.prepare.outputs.release_sha }}-${{ inputs.architecture }}
          provenance: mode=max
          sbom: true
          target: ingest
      - name: Publish extract
        id: extract
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/scholight-extract/Dockerfile
          push: true
          platforms: linux/${{ inputs.architecture }}
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_EXTRACT_REPOSITORY }}:git-${{ needs.prepare.outputs.release_sha }}-${{ inputs.architecture }}
          provenance: mode=max
          sbom: true
      - name: Publish web
        id: web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          platforms: linux/${{ inputs.architecture }}
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_WEB_REPOSITORY }}:git-${{ needs.prepare.outputs.release_sha }}-${{ inputs.architecture }}
          provenance: mode=max
          sbom: true
      - name: Record immutable outputs
        env:
          SHA: ${{ needs.prepare.outputs.release_sha }}
          ARCH: ${{ inputs.architecture }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          EXTRACT_DIGEST: ${{ steps.extract.outputs.digest }}
          METADATA_DIGEST: ${{ steps.metadata.outputs.digest }}
          INGEST_DIGEST: ${{ steps.ingest.outputs.digest }}
          RELEASE_BUCKET_NAME: ${{ vars.RELEASE_BUCKET_NAME }}
        run: |
          if [ "$ARCH" = arm64 ]; then
            python scripts/personal_manifest.py create --file personal-images.json
            aws s3api put-object --bucket "$RELEASE_BUCKET_NAME" --key "releases/${SHA}/arm64-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json" --body personal-images.json --content-type application/json --if-none-match '*'
          else
            jq -n '{commit: env.SHA, architecture: env.ARCH, api: env.API_DIGEST, web: env.WEB_DIGEST, extract: env.EXTRACT_DIGEST, metadata: env.METADATA_DIGEST, ingest: env.INGEST_DIGEST}' > personal-images.json
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: personal-images-${{ inputs.architecture }}
          path: personal-images.json
