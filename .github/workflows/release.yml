name: Deploy immutable release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy a release or roll back to a previous immutable release
        required: true
        type: choice
        options: [deploy, rollback]
      release_sha:
        description: Exact 40-character SHA whose release manifest will be deployed
        required: true
        type: string
      application_enabled:
        description: Start application services (set false only for first database bootstrap)
        required: true
        default: "true"
        type: choice
        options: ["false", "true"]
      survey_runtime_enabled:
        description: Run Survey workers
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
      survey_public_mode:
        description: Expose Survey to all users
        required: true
        default: "off"
        type: choice
        options: ["off", "all"]
      survey_dispatch_mode:
        description: Select legacy resident workers or event-driven standalone tasks
        required: true
        default: legacy
        type: choice
        options: [legacy, event]
      survey_control_reserved_concurrency:
        description: Optionally reserve one Lambda execution after account quota is available
        required: true
        default: "0"
        type: choice
        options: ["0", "1"]
      scheduler_state:
        description: Run ingest and metadata schedules
        required: true
        default: DISABLED
        type: choice
        options: [DISABLED, ENABLED]
      survey_capacity_stage:
        description: Reviewed Draft/Full worker ceiling stage
        required: true
        default: 1/1
        type: choice
        options: [1/1, 2/2, 4/4, 8/8]
      survey_capacity_prerequisites_confirmed:
        description: Confirm Fargate, model, image, and mail capacity before the final 8/8 stage
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
      survey_workers_idle_confirmation:
        description: Enter SURVEY WORKERS IDLE only when activity metrics are unavailable
        required: false
        default: ""
        type: string
      confirmation:
        description: Type DEPLOY SCHOLIGHT PRODUCTION or ROLLBACK SCHOLIGHT PRODUCTION
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: scholight-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate release selection
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          APPLICATION_ENABLED: ${{ inputs.application_enabled }}
          SURVEY_RUNTIME_ENABLED: ${{ inputs.survey_runtime_enabled }}
          SURVEY_PUBLIC_MODE: ${{ inputs.survey_public_mode }}
          SURVEY_DISPATCH_MODE: ${{ inputs.survey_dispatch_mode }}
          SURVEY_CONTROL_RESERVED_CONCURRENCY: ${{ inputs.survey_control_reserved_concurrency }}
          SURVEY_CAPACITY_STAGE: ${{ inputs.survey_capacity_stage }}
          SURVEY_CAPACITY_PREREQUISITES_CONFIRMED: ${{ inputs.survey_capacity_prerequisites_confirmed }}
          OPERATION: ${{ inputs.operation }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          expected_confirmation="${OPERATION^^} SCHOLIGHT PRODUCTION"
          test "$CONFIRMATION" = "$expected_confirmation"
          if [[ "$APPLICATION_ENABLED" != true && "$SURVEY_RUNTIME_ENABLED" == true ]]; then
            echo "Survey workers cannot run while application services are disabled" >&2
            exit 1
          fi
          if [[ "$SURVEY_PUBLIC_MODE" == all && "$SURVEY_RUNTIME_ENABLED" != true ]]; then
            echo "Survey cannot be public unless its workers are running" >&2
            exit 1
          fi
          case "$SURVEY_CONTROL_RESERVED_CONCURRENCY" in
            0|1) ;;
            *)
              echo "Survey control reserved concurrency must be zero or one" >&2
              exit 1
              ;;
          esac
          if [[ "$SURVEY_DISPATCH_MODE" != event && "$SURVEY_CONTROL_RESERVED_CONCURRENCY" != 0 ]]; then
            echo "Survey control concurrency can be reserved only in event mode" >&2
            exit 1
          fi
          case "$SURVEY_CAPACITY_STAGE" in
            1/1|2/2|4/4|8/8) ;;
            *)
              echo "Survey capacity must use a reviewed Draft/Full stage" >&2
              exit 1
              ;;
          esac
          survey_draft_max_tasks=${SURVEY_CAPACITY_STAGE%/*}
          survey_full_max_tasks=${SURVEY_CAPACITY_STAGE#*/}
          echo "SURVEY_DRAFT_MAX_TASKS=$survey_draft_max_tasks" >> "$GITHUB_ENV"
          echo "SURVEY_FULL_MAX_TASKS=$survey_full_max_tasks" >> "$GITHUB_ENV"
          if [[ "$SURVEY_CAPACITY_STAGE" == 8/8 && "$SURVEY_CAPACITY_PREREQUISITES_CONFIRMED" != true ]]; then
            echo "The final Survey 8/8 stage requires confirmed infrastructure and provider capacity" >&2
            exit 1
          fi
      - name: Check out exact release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false
      - name: Configure AWS deployment credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Verify Survey control concurrency capacity
        if: inputs.survey_dispatch_mode == 'event'
        env:
          SURVEY_CONTROL_RESERVED_CONCURRENCY: ${{ inputs.survey_control_reserved_concurrency }}
        run: |
          unreserved=$(aws lambda get-account-settings \
            --query 'AccountLimit.UnreservedConcurrentExecutions' \
            --output text)
          if (( unreserved < 1 )); then
            echo "Event dispatch requires at least one unreserved Lambda execution" >&2
            exit 1
          fi
          if [[ "$SURVEY_CONTROL_RESERVED_CONCURRENCY" == 0 ]]; then
            echo "Event dispatch will serialize cycles with the PostgreSQL session lock."
            exit 0
          fi
          current_reserved=0
          if concurrency=$(aws lambda get-function-concurrency \
            --function-name sanchezcloud-scholight-survey-control 2>/dev/null); then
            current_reserved=$(jq -r '.ReservedConcurrentExecutions // 0' <<<"$concurrency")
          fi
          additional_reservation=$((current_reserved >= 1 ? 0 : 1))
          required_unreserved=$((10 + additional_reservation))
          if (( unreserved < required_unreserved )); then
            echo "The requested Survey control reservation cannot be allocated" >&2
            echo "Lambda must retain at least 10 unreserved executions after reservation" >&2
            echo "Current unreserved: ${unreserved}; required before update: ${required_unreserved}" >&2
            exit 1
          fi
      - name: Download and verify release manifest
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          account_id=$(aws sts get-caller-identity --query Account --output text)
          bucket="sanchezcloud-scholight-releases-${account_id}-${AWS_REGION}"
          aws s3 cp "s3://${bucket}/releases/${RELEASE_SHA}/manifest.json" release-manifest.json
          python scripts/release_manifest.py verify \
            --manifest release-manifest.json \
            --expected-release-sha "$RELEASE_SHA"
      - name: Verify final Survey capacity prerequisites
        if: inputs.survey_capacity_stage == '8/8'
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          quota=$(aws service-quotas get-service-quota \
            --service-code fargate \
            --quota-code L-3032A538 \
            --query 'Quota.Value' \
            --output text)
          python - "$quota" <<'PY'
          import sys
          if float(sys.argv[1]) < 64:
              raise SystemExit("The final Survey 8/8 stage requires a Fargate On-Demand vCPU quota of at least 64")
          PY
      - name: Enforce the reviewed Survey capacity ladder
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          DESIRED_STAGE: ${{ inputs.survey_capacity_stage }}
        run: |
          desired_draft=${DESIRED_STAGE%/*}
          desired_full=${DESIRED_STAGE#*/}
          stack_error=$(mktemp)
          set +e
          stack=$(aws cloudformation describe-stacks \
            --stack-name sanchezcloud-scholight-production \
            --output json 2>"$stack_error")
          stack_status=$?
          set -e
          if [[ "$stack_status" -ne 0 ]]; then
            if grep -q "does not exist" "$stack_error"; then
              rm -f "$stack_error"
              if [[ "$DESIRED_STAGE" != "1/1" ]]; then
                echo "The first Survey capacity deployment must remain at 1/1" >&2
                exit 1
              fi
              exit 0
            fi
            cat "$stack_error" >&2
            rm -f "$stack_error"
            exit "$stack_status"
          fi
          rm -f "$stack_error"
          current_draft=$(jq -r \
            '([.Stacks[0].Parameters[] | select(.ParameterKey == "SurveyDraftMaxTasks") | .ParameterValue][0] // "1")' \
            <<<"$stack")
          current_full=$(jq -r \
            '([.Stacks[0].Parameters[] | select(.ParameterKey == "SurveyFullMaxTasks") | .ParameterValue][0] // "1")' \
            <<<"$stack")
          python scripts/check_survey_capacity_stage.py \
            --current-draft "$current_draft" \
            --current-full "$current_full" \
            --desired-draft "$desired_draft" \
            --desired-full "$desired_full"
      - name: Register candidate Survey canary task
        if: inputs.survey_runtime_enabled == 'true'
        id: survey_canary
        run: |
          desired_image=$(jq -r .images.survey release-manifest.json)
          aws ecs describe-task-definition \
            --task-definition sanchezcloud-scholight-survey \
            --query taskDefinition > survey-task.json
          jq --arg image "$desired_image" '
            {
              family: "sanchezcloud-scholight-survey-canary",
              taskRoleArn, executionRoleArn, networkMode,
              containerDefinitions, volumes, placementConstraints,
              requiresCompatibilities, cpu, memory, runtimePlatform,
              ephemeralStorage
            }
            | .containerDefinitions[0].image = $image
            | .cpu = "512"
            | .memory = "1024"
            | with_entries(select(.value != null))
          ' survey-task.json > survey-canary-task.json
          task_definition=$(aws ecs register-task-definition \
            --cli-input-json file://survey-canary-task.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "task_definition=$task_definition" >> "$GITHUB_OUTPUT"
      - name: Run candidate Survey release canaries
        if: inputs.survey_runtime_enabled == 'true'
        env:
          CANARY_TASK_DEFINITION: ${{ steps.survey_canary.outputs.task_definition }}
        run: |
          # JMESPath and jq programs are literal expressions.
          # shellcheck disable=SC2016
          subnet_1=$(aws cloudformation list-exports \
            --query 'Exports[?Name==`sanchezcloud-production-private-subnet-1`].Value|[0]' \
            --output text)
          # shellcheck disable=SC2016
          subnet_2=$(aws cloudformation list-exports \
            --query 'Exports[?Name==`sanchezcloud-production-private-subnet-2`].Value|[0]' \
            --output text)
          # shellcheck disable=SC2016
          task_sg=$(aws cloudformation describe-stacks \
            --stack-name sanchezcloud-scholight-production \
            --query 'Stacks[0].Outputs[?OutputKey==`TaskSecurityGroupId`].OutputValue|[0]' \
            --output text)
          network=$(jq -cn \
            --arg subnet1 "$subnet_1" --arg subnet2 "$subnet_2" --arg sg "$task_sg" \
            '{awsvpcConfiguration:{subnets:[$subnet1,$subnet2],securityGroups:[$sg],assignPublicIp:"DISABLED"}}')
          canary_command='scholight survey model-canary --json-output && scholight survey image-canary --json-output && scholight survey fulltext-canary --json-output'
          overrides=$(jq -cn --arg canary "$canary_command" \
            '{containerOverrides:[{name:"survey",command:["/bin/sh","-ec",$canary]}]}')
          response=$(aws ecs run-task \
            --cluster sanchezcloud-production \
            --launch-type FARGATE \
            --task-definition "$CANARY_TASK_DEFINITION" \
            --network-configuration "$network" \
            --overrides "$overrides" \
            --started-by "github-canary-${GITHUB_RUN_ID}")
          test "$(jq '.failures | length' <<<"$response")" = 0
          task_arn=$(jq -r '.tasks[0].taskArn' <<<"$response")
          test -n "$task_arn"
          deadline=$((SECONDS + 1200))
          while true; do
            task=$(aws ecs describe-tasks \
              --cluster sanchezcloud-production --tasks "$task_arn")
            status=$(jq -r '.tasks[0].lastStatus' <<<"$task")
            if [[ "$status" == STOPPED ]]; then
              break
            fi
            if (( SECONDS >= deadline )); then
              aws ecs stop-task \
                --cluster sanchezcloud-production \
                --task "$task_arn" \
                --reason "Candidate Survey canary timed out" >/dev/null
              echo "Candidate Survey canaries timed out" >&2
              exit 1
            fi
            sleep 15
          done
          task_id=${task_arn##*/}
          aws logs get-log-events \
            --log-group-name /sanchezcloud/scholight/survey \
            --log-stream-name "full/survey/${task_id}" \
            --start-from-head --limit 50 \
            --query 'events[].message' --output text
          exit_code=$(jq -r '.tasks[0].containers[] | select(.name == "survey") | .exitCode' \
            <<<"$task")
          if [[ "$exit_code" != 0 ]]; then
            echo "Candidate Survey canaries failed with exit code $exit_code" >&2
            exit 1
          fi
      - name: Retire candidate Survey canary task definition
        if: always() && steps.survey_canary.outputs.task_definition != ''
        env:
          CANARY_TASK_DEFINITION: ${{ steps.survey_canary.outputs.task_definition }}
        run: aws ecs deregister-task-definition --task-definition "$CANARY_TASK_DEFINITION" >/dev/null
      - name: Defer active Survey worker image replacements
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          IDLE_CONFIRMATION: ${{ inputs.survey_workers_idle_confirmation }}
        run: |
          desired_image=$(jq -r .images.survey release-manifest.json)
          stack_error=$(mktemp)
          set +e
          stack=$(aws cloudformation describe-stacks \
            --stack-name sanchezcloud-scholight-production \
            --output json 2>"$stack_error")
          stack_status=$?
          set -e
          if [[ "$stack_status" -ne 0 ]]; then
            if grep -q "does not exist" "$stack_error"; then
              rm -f "$stack_error"
              exit 0
            fi
            cat "$stack_error" >&2
            rm -f "$stack_error"
            exit "$stack_status"
          fi
          rm -f "$stack_error"
          current_image=$(jq -r '.Stacks[0].Parameters[] | select(.ParameterKey == "SurveyImage") | .ParameterValue' <<<"$stack")
          runtime_enabled=$(jq -r '.Stacks[0].Parameters[] | select(.ParameterKey == "SurveyRuntimeEnabled") | .ParameterValue' <<<"$stack")
          if [[ "$runtime_enabled" != true ]]; then
            exit 0
          fi
          resource_change=false
          check_task_size() {
            local service=$1 expected_cpu=$2 expected_memory=$3
            local task_definition current_cpu current_memory
            task_definition=$(aws ecs describe-services \
              --cluster sanchezcloud-production \
              --services "$service" \
              --query 'services[0].taskDefinition' --output text)
            read -r current_cpu current_memory < <(aws ecs describe-task-definition \
              --task-definition "$task_definition" \
              --query 'taskDefinition.[cpu,memory]' --output text)
            if [[ "$current_cpu" != "$expected_cpu" || "$current_memory" != "$expected_memory" ]]; then
              resource_change=true
            fi
          }
          check_task_size scholight-survey-draft 256 512
          check_task_size scholight-survey 1024 2048
          if [[ "$current_image" == "$desired_image" && "$resource_change" != true ]]; then
            exit 0
          fi
          end_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          start_time=$(date -u -d '10 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          draft=$(aws cloudwatch get-metric-statistics \
            --namespace Scholight/Production \
            --metric-name SurveyDraftRunning \
            --dimensions Name=service,Value=survey-draft-worker \
            --start-time "$start_time" --end-time "$end_time" \
            --period 60 --statistics Maximum)
          full=$(aws cloudwatch get-metric-statistics \
            --namespace Scholight/Production \
            --metric-name SurveyJobRunning \
            --dimensions Name=service,Value=survey-full-worker \
            --start-time "$start_time" --end-time "$end_time" \
            --period 60 --statistics Maximum)
          draft_running=$(jq '[.Datapoints[].Maximum] | max // 0' <<<"$draft")
          full_running=$(jq '[.Datapoints[].Maximum] | max // 0' <<<"$full")
          metric_args=()
          if [[ $(jq '.Datapoints | length' <<<"$draft") -gt 0 && $(jq '.Datapoints | length' <<<"$full") -gt 0 ]]; then
            metric_args+=(--metrics-observed)
          fi
          if [[ "$resource_change" == true ]]; then
            metric_args+=(--require-idle)
          fi
          selected_image=$(python scripts/check_survey_worker_update.py \
            --current-image "$current_image" \
            --desired-image "$desired_image" \
            --runtime-enabled \
            "${metric_args[@]}" \
            --draft-running "$draft_running" \
            --full-running "$full_running" \
            --idle-confirmation "$IDLE_CONFIRMATION")
          echo "SURVEY_IMAGE_OVERRIDE=$selected_image" >> "$GITHUB_ENV"
          if [[ "$selected_image" != "$desired_image" ]]; then
            echo "SURVEY_IMAGE_DEFERRED=true" >> "$GITHUB_ENV"
            echo "Survey image update deferred; active workers keep the current digest." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy digest-qualified ECS release
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          DOMAIN_NAME: ${{ vars.PRODUCTION_DOMAIN }}
          CERTIFICATE_ARN: ${{ vars.PRODUCTION_CERTIFICATE_ARN }}
          RDS_SECURITY_GROUP_ID: ${{ vars.RDS_SECURITY_GROUP_ID }}
          CLOUDFORMATION_ROLE_ARN: ${{ vars.AWS_CLOUDFORMATION_ROLE_ARN }}
          APPLICATION_ENABLED: ${{ inputs.application_enabled }}
          SURVEY_RUNTIME_ENABLED: ${{ inputs.survey_runtime_enabled }}
          SURVEY_PUBLIC_MODE: ${{ inputs.survey_public_mode }}
          SURVEY_DISPATCH_MODE: ${{ inputs.survey_dispatch_mode }}
          SURVEY_CONTROL_RESERVED_CONCURRENCY: ${{ inputs.survey_control_reserved_concurrency }}
          SCHEDULER_STATE: ${{ inputs.scheduler_state }}
        run: |
          account_id=$(aws sts get-caller-identity --query Account --output text)
          template_bucket="sanchezcloud-scholight-releases-${account_id}-${AWS_REGION}"
          web_image=$(jq -r .images.web release-manifest.json)
          api_image=$(jq -r .images.api release-manifest.json)
          extract_image=$(jq -r .images.extract release-manifest.json)
          ingest_image=$(jq -r .images.ingest release-manifest.json)
          survey_image=${SURVEY_IMAGE_OVERRIDE:-$(jq -r .images.survey release-manifest.json)}
          aws cloudformation deploy \
            --stack-name sanchezcloud-scholight-production \
            --template-file deploy/ecs/scholight-production.yml \
            --s3-bucket "$template_bucket" \
            --s3-prefix "cloudformation/${RELEASE_SHA}" \
            --role-arn "$CLOUDFORMATION_ROLE_ARN" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              DomainName="$DOMAIN_NAME" \
              CertificateArn="$CERTIFICATE_ARN" \
              RdsSecurityGroupId="$RDS_SECURITY_GROUP_ID" \
              WebImage="$web_image" \
              ApiImage="$api_image" \
              ExtractImage="$extract_image" \
              IngestImage="$ingest_image" \
              SurveyImage="$survey_image" \
              ApplicationEnabled="$APPLICATION_ENABLED" \
              SurveyRuntimeEnabled="$SURVEY_RUNTIME_ENABLED" \
              SurveyPublicMode="$SURVEY_PUBLIC_MODE" \
              SurveyDispatchMode="$SURVEY_DISPATCH_MODE" \
              SurveyControlReservedConcurrency="$SURVEY_CONTROL_RESERVED_CONCURRENCY" \
              SurveyDraftMaxTasks="$SURVEY_DRAFT_MAX_TASKS" \
              SurveyFullMaxTasks="$SURVEY_FULL_MAX_TASKS" \
              SchedulerState="$SCHEDULER_STATE"
      - name: Wait for services to stabilize
        run: |
          cluster=sanchezcloud-production
          # JMESPath uses literal backticks.
          # shellcheck disable=SC2016
          mapfile -t services < <(aws cloudformation describe-stack-resources \
            --stack-name sanchezcloud-scholight-production \
            --query 'StackResources[?ResourceType==`AWS::ECS::Service`].PhysicalResourceId' \
            --output text | tr '\t' '\n')
          (( ${#services[@]} > 0 ))
          aws ecs wait services-stable --cluster "$cluster" --services "${services[@]}"
      - name: Verify public deployment from the runner
        if: inputs.application_enabled == 'true'
        env:
          PRODUCTION_DOMAIN: ${{ vars.PRODUCTION_DOMAIN }}
          SURVEY_PUBLIC_MODE: ${{ inputs.survey_public_mode }}
        run: |
          [[ "$PRODUCTION_DOMAIN" =~ ^[A-Za-z0-9.-]+$ ]]
          retry() {
            local url=$1
            for attempt in {1..18}; do
              if curl --fail --silent --show-error --output /dev/null "$url"; then
                return 0
              fi
              (( attempt == 18 )) || sleep 10
            done
            echo "External smoke check failed: $url" >&2
            return 1
          }
          retry "https://${PRODUCTION_DOMAIN}/healthz"
          retry "https://${PRODUCTION_DOMAIN}/api/openapi.json"
          retry "https://${PRODUCTION_DOMAIN}/llms.txt"
          retry "https://${PRODUCTION_DOMAIN}/docs.md"
          capabilities=$(curl --fail --silent --show-error \
            "https://${PRODUCTION_DOMAIN}/api/capabilities")
          test "$(jq -r .survey <<<"$capabilities")" = "$SURVEY_PUBLIC_MODE"
      - name: Record release operation
        run: |
          {
            echo "### Scholight ${{ inputs.operation }}"
            echo "- Release: \`${{ inputs.release_sha }}\`"
            echo "- Application: \`${{ inputs.application_enabled }}\`"
            echo "- Survey runtime: \`${{ inputs.survey_runtime_enabled }}\`"
            echo "- Survey public mode: \`${{ inputs.survey_public_mode }}\`"
            echo "- Survey dispatch mode: \`${{ inputs.survey_dispatch_mode }}\`"
            echo "- Survey control reserved concurrency: \`${{ inputs.survey_control_reserved_concurrency }}\`"
            echo "- Survey capacity stage (Draft/Full): \`${{ inputs.survey_capacity_stage }}\`"
            echo "- Final capacity prerequisites confirmed: \`${{ inputs.survey_capacity_prerequisites_confirmed }}\`"
            echo "- Survey image deferred: \`${SURVEY_IMAGE_DEFERRED:-false}\`"
            echo "- Schedulers: \`${{ inputs.scheduler_state }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
