name: Run production Survey rerun

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact deployed 40-character Scholight release SHA
        required: true
        type: string
      source_survey_id:
        description: Terminal source Survey UUID whose owner and request will be reused
        required: true
        type: string
      operation_id:
        description: Stable UUID idempotency key for this one new Survey
        required: true
        type: string
      confirmation:
        description: Type RERUN SCHOLIGHT SURVEY
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: scholight-production-survey-rerun
  cancel-in-progress: false

jobs:
  rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 250
    environment: production
    steps:
      - name: Validate fixed operation inputs
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          SOURCE_SURVEY_ID: ${{ inputs.source_survey_id }}
          OPERATION_ID: ${{ inputs.operation_id }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_SURVEY_ID" =~ ^[0-9a-fA-F-]{36}$ ]]
          [[ "$OPERATION_ID" =~ ^[0-9a-fA-F-]{36}$ ]]
          test "$CONFIRMATION" = "RERUN SCHOLIGHT SURVEY"
          python - "$SOURCE_SURVEY_ID" "$OPERATION_ID" <<'PY'
          import sys
          from uuid import UUID
          for value in sys.argv[1:]:
              UUID(value)
          PY
      - name: Check out exact deployed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false
      - name: Configure AWS production credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Verify the exact deployed API image
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          account_id=$(aws sts get-caller-identity --query Account --output text)
          bucket="sanchezcloud-scholight-releases-${account_id}-${AWS_REGION}"
          aws s3 cp "s3://${bucket}/releases/${RELEASE_SHA}/manifest.json" release-manifest.json
          python scripts/release_manifest.py verify \
            --manifest release-manifest.json \
            --expected-release-sha "$RELEASE_SHA"
          desired_api_image=$(jq -r .images.api release-manifest.json)
          # shellcheck disable=SC2016
          deployed_api_image=$(aws cloudformation describe-stacks \
            --stack-name sanchezcloud-scholight-production \
            --query 'Stacks[0].Parameters[?ParameterKey==`ApiImage`].ParameterValue|[0]' \
            --output text)
          test "$deployed_api_image" = "$desired_api_image"
          # shellcheck disable=SC2016
          task_api_image=$(aws ecs describe-task-definition \
            --task-definition sanchezcloud-scholight-api \
            --query 'taskDefinition.containerDefinitions[?name==`api`].image|[0]' \
            --output text)
          test "$task_api_image" = "$desired_api_image"
      - name: Run one owner-preserving rerun and verify it
        env:
          SOURCE_SURVEY_ID: ${{ inputs.source_survey_id }}
          OPERATION_ID: ${{ inputs.operation_id }}
        run: |
          # JMESPath and jq programs are literal expressions.
          # shellcheck disable=SC2016
          subnet_1=$(aws cloudformation list-exports \
            --query 'Exports[?Name==`sanchezcloud-production-private-subnet-1`].Value|[0]' \
            --output text)
          # shellcheck disable=SC2016
          subnet_2=$(aws cloudformation list-exports \
            --query 'Exports[?Name==`sanchezcloud-production-private-subnet-2`].Value|[0]' \
            --output text)
          # shellcheck disable=SC2016
          task_sg=$(aws cloudformation describe-stacks \
            --stack-name sanchezcloud-scholight-production \
            --query 'Stacks[0].Outputs[?OutputKey==`TaskSecurityGroupId`].OutputValue|[0]' \
            --output text)
          network=$(jq -cn \
            --arg subnet1 "$subnet_1" --arg subnet2 "$subnet_2" --arg sg "$task_sg" \
            '{awsvpcConfiguration:{subnets:[$subnet1,$subnet2],securityGroups:[$sg],assignPublicIp:"DISABLED"}}')
          overrides=$(jq -cn \
            --arg source "$SOURCE_SURVEY_ID" --arg operation "$OPERATION_ID" \
            '{containerOverrides:[{name:"api",command:["python","-m","scholight.survey.production_ops","rerun-and-verify","--source-survey-id",$source,"--operation-id",$operation,"--minimum-coverage","80","--timeout-seconds","10800","--poll-seconds","30","--notify-on-completion"]}]}')
          response=$(aws ecs run-task \
            --cluster sanchezcloud-production \
            --launch-type FARGATE \
            --task-definition sanchezcloud-scholight-api \
            --network-configuration "$network" \
            --overrides "$overrides" \
            --started-by "github-${GITHUB_RUN_ID}")
          test "$(jq '.failures | length' <<<"$response")" = 0
          task_arn=$(jq -r '.tasks[0].taskArn' <<<"$response")
          test -n "$task_arn"
          deadline=$((SECONDS + 14400))
          while true; do
            task=$(aws ecs describe-tasks \
              --cluster sanchezcloud-production --tasks "$task_arn")
            status=$(jq -r '.tasks[0].lastStatus' <<<"$task")
            if [[ "$status" == STOPPED ]]; then
              break
            fi
            if (( SECONDS >= deadline )); then
              echo "Production Survey verification task timed out" >&2
              exit 1
            fi
            sleep 30
          done
          task_id=${task_arn##*/}
          aws logs get-log-events \
            --log-group-name /sanchezcloud/scholight/api \
            --log-stream-name "api/api/${task_id}" \
            --start-from-head --limit 50 \
            --query 'events[].message' --output text
          exit_code=$(jq -r '.tasks[0].containers[] | select(.name == "api") | .exitCode' \
            <<<"$task")
          if [[ "$exit_code" != 0 ]]; then
            aws logs filter-log-events \
              --log-group-name /sanchezcloud/scholight/api \
              --filter-pattern "\"$SOURCE_SURVEY_ID\"" \
              --limit 20 --query 'events[].message' --output text || true
            echo "Production Survey rerun failed acceptance with exit code $exit_code" >&2
            exit 1
          fi
          survey_id=$(python - "$OPERATION_ID" <<'PY'
          import sys
          from uuid import NAMESPACE_URL, UUID, uuid5
          operation_id = UUID(sys.argv[1])
          print(uuid5(NAMESPACE_URL, f"scholight:production-survey-rerun:{operation_id}:survey"))
          PY
          )
          job_id=$(python - "$OPERATION_ID" <<'PY'
          import sys
          from uuid import NAMESPACE_URL, UUID, uuid5
          operation_id = UUID(sys.argv[1])
          print(uuid5(NAMESPACE_URL, f"scholight:production-survey-rerun:{operation_id}:job"))
          PY
          )
          {
            echo "### Production Survey rerun accepted"
            echo "- Source Survey: \`$SOURCE_SURVEY_ID\`"
            echo "- New Survey: \`$survey_id\`"
            echo "- New job: \`$job_id\`"
            echo "- Minimum full-text coverage: \`80%\`"
          } >> "$GITHUB_STEP_SUMMARY"
