name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Git revision to verify
        required: false
        type: string
    secrets:
      CLOUD_AUTH_READ_TOKEN:
        description: Read-only token for the pinned private cloud-auth repository
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      SCHOLIGHT_DATA_ROOT: /tmp/scholight-ci
      SCHOLIGHT_DISABLE_DOTENV: "1"
      SCHOLIGHT_PG_HOST: 127.0.0.1
      SCHOLIGHT_PG_PORT: "5432"
      SCHOLIGHT_PG_DATABASE: scholight_test_ingestion
      SCHOLIGHT_PG_USER: postgres
      SCHOLIGHT_PG_PASSWORD: integration-test-password
      SCHOLIGHT_PG_SSL_ROOT_CERT: disable
      SCHOLIGHT_ZILLIZ_URI: http://127.0.0.1:9
      SCHOLIGHT_EMBEDDING_BASE_URL: http://127.0.0.1:9/v1
      SCHOLIGHT_TEST_DATABASE_URL: postgresql://postgres:integration-test-password@127.0.0.1:5432/scholight_test_ingestion
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: integration-test-password
          POSTGRES_DB: scholight_test_ingestion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d scholight_test_ingestion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 5s
    steps:
      - name: Check out Scholight
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Configure read-only private dependency access
        env:
          CLOUD_AUTH_READ_TOKEN: ${{ secrets.CLOUD_AUTH_READ_TOKEN }}
        run: >-
          git config --global
          url."https://x-access-token:${CLOUD_AUTH_READ_TOKEN}@github.com/".insteadOf
          "https://github.com/"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.9.2"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev
      - name: Ruff lint
        run: uv run ruff check
      - name: Ruff format
        run: uv run ruff format --check
      - name: Mypy
        run: uv run mypy scholight
      - name: Unit tests
        run: uv run pytest scholight/ tests/ -v --tb=short
      - name: PostgreSQL ingestion and hermetic workflow tests
        run: >-
          uv run pytest
          scholight/db/tests/
          scholight/scheduler/tests/test_ingestion_e2e_pg.py
          -m pg_integration -v --tb=short
      - name: Bandit
        run: uv run bandit -c pyproject.toml -r scholight/ --severity-level medium
      - name: Vulture
        run: uv run vulture scholight/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out Scholight
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Configure read-only private dependency access
        env:
          CLOUD_AUTH_READ_TOKEN: ${{ secrets.CLOUD_AUTH_READ_TOKEN }}
        run: >-
          git config --global
          url."https://x-access-token:${CLOUD_AUTH_READ_TOKEN}@github.com/".insteadOf
          "https://github.com/"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.9.2"
          enable-cache: true
      - name: Install locked backend dependencies for OpenAPI generation
        working-directory: .
        run: uv sync --frozen --extra dev
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify frontend
        run: npm run verify

  deployment-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: migration-test-password
          POSTGRES_DB: sanchezcloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sanchezcloud"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 5s
    steps:
      - name: Check out Scholight
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Check out pinned cloud-auth migration owner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: EricSanchezok/cloud-auth
          ref: 9e82bb25f38a33aaa309933bfb0affb6d47c1df2
          token: ${{ secrets.CLOUD_AUTH_READ_TOKEN }}
          path: .ci/cloud-auth
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.9.2"
          enable-cache: true
      - name: Install pinned auth migration tool
        working-directory: .ci/cloud-auth
        run: uv sync --frozen
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Validate shell scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          bash -n deploy/production/bootstrap.sh deploy/production/release.sh deploy/production/smoke.sh deploy/production/wait-ssm.sh
          sh -n frontend/runtime/render-docs.sh
          shellcheck deploy/production/bootstrap.sh deploy/production/release.sh deploy/production/smoke.sh deploy/production/wait-ssm.sh tests/deploy/test_keepalive_integration.sh tests/deploy/test_edge_ingress_integration.sh
          shellcheck -s sh frontend/runtime/render-docs.sh
      - name: Validate production Compose
        env:
          SCHOLIGHT_BACKEND_IMAGE: registry.example/scholight/backend@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          SCHOLIGHT_FRONTEND_IMAGE: registry.example/scholight/frontend@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          SCHOLIGHT_EXTRACT_IMAGE: registry.example/scholight/extract@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
          SCHOLIGHT_DOMAIN: scholight.example.invalid
          SCHOLIGHT_EDGE_DOMAIN: edge.example.invalid
          SCHOLIGHT_ACME_EMAIL: operator@example.invalid
          SCHOLIGHT_DOCKER_SUBNET: 172.31.0.0/24
          SCHOLIGHT_CADDY_IP: 172.31.0.2
          SCHOLIGHT_FRONTEND_IP: 172.31.0.10
          SCHOLIGHT_API_IP: 172.31.0.20
          SCHOLIGHT_EXTRACT_IP: 172.31.0.25
          SCHOLIGHT_METADATA_SYNC_IP: 172.31.0.30
          SCHOLIGHT_PAPER_INGEST_IP: 172.31.0.40
          SCHOLIGHT_PG_HOST: postgres.example.invalid
          SCHOLIGHT_PG_DATABASE: sanchezcloud
          SCHOLIGHT_APP_PG_USER: scholight_app
          SCHOLIGHT_APP_PG_PASSWORD: fixture-not-a-secret
          SCHOLIGHT_MIGRATION_PG_USER: scholight_migrator
          SCHOLIGHT_MIGRATION_PG_PASSWORD: fixture-not-a-secret
          SCHOLIGHT_ZILLIZ_URI: https://zilliz.example.invalid
          SCHOLIGHT_ZILLIZ_TOKEN: fixture-not-a-secret
          SCHOLIGHT_EMBEDDING_BASE_URL: https://embedding.example.invalid/v1
          SCHOLIGHT_EMBEDDING_API_KEY: fixture-not-a-secret
          SCHOLIGHT_EMBEDDING_MODEL: fixture-model
          SCHOLIGHT_AUTH_JWT_SECRET: fixture-secret-at-least-thirty-two-bytes
          SCHOLIGHT_ANONYMOUS_QUOTA_HMAC_SECRET: another-fixture-secret-at-least-32-bytes
          SCHOLIGHT_ACCESS_KEY_HMAC_SECRET: access-key-fixture-secret-at-least-32-bytes
          SCHOLIGHT_MCP_DELEGATION_JWT_SECRET: delegation-fixture-secret-at-least-32-bytes
          SCHOLIGHT_EXTRACT_INTERNAL_TOKEN: extract-fixture-secret-at-least-32-bytes
          SCHOLIGHT_PUBLIC_WEB_URL: https://scholight.example.invalid
          SCHOLIGHT_CORS_ALLOW_ORIGINS: '["https://scholight.example.invalid","https://edge.example.invalid"]'
        run: docker compose -f deploy/production/compose.yaml config --quiet
      - name: Validate Caddyfile
        run: |
          docker run --rm \
            -e SCHOLIGHT_DOMAIN=scholight.example.invalid \
            -e SCHOLIGHT_EDGE_DOMAIN=edge.example.invalid \
            -e SCHOLIGHT_ACME_EMAIL=operator@example.invalid \
            -v "$PWD/deploy/production/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d \
            caddy validate --config /etc/caddy/Caddyfile
      - name: Build frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
      - name: Build backend image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/scholight-api/Dockerfile
          push: false
          load: true
          tags: scholight-api:ci
          secrets: |
            github_token=${{ secrets.CLOUD_AUTH_READ_TOKEN }}
      - name: Build Web Extract image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/scholight-extract/Dockerfile
          push: false
      - name: Verify backend host package
        if: github.event_name != 'pull_request'
        run: |
          docker run --rm --user 0 --entrypoint /bin/sh scholight-api:ci -ec '
            for name in bootstrap.sh release.sh smoke.sh wait-ssm.sh compose.yaml Caddyfile cloudwatch-agent.json bootstrap-db.sql; do
              test -f "/opt/scholight-package/${name}"
            done
            test -x /opt/scholight-package/bootstrap.sh
            test -x /opt/scholight-package/release.sh
            test -x /usr/local/bin/accelerate
            /usr/local/bin/accelerate --help >/dev/null
          '
      - name: Verify Caddy and Uvicorn idle keep-alive integration
        if: github.event_name != 'pull_request'
        run: tests/deploy/test_keepalive_integration.sh
      - name: Verify canonical HTTPS and edge HTTP ingress isolation
        if: github.event_name != 'pull_request'
        run: tests/deploy/test_edge_ingress_integration.sh
      - name: Smoke-test built backend migrations with least-privilege roles
        if: github.event_name != 'pull_request'
        env:
          POSTGRES_PASSWORD: migration-test-password
          AUTH_MIGRATOR_PASSWORD: auth-migrator-test-password
          MIGRATOR_PASSWORD: migrator-test-password
          APP_PASSWORD: app-test-password
          POSTGRES_IMAGE: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        run: |
          docker run --rm --network host \
            -e PGPASSWORD="$POSTGRES_PASSWORD" \
            "$POSTGRES_IMAGE" \
            psql -h 127.0.0.1 -U postgres -d sanchezcloud -v ON_ERROR_STOP=1 -c \
              "CREATE ROLE auth_migrator LOGIN PASSWORD '$AUTH_MIGRATOR_PASSWORD';
               CREATE ROLE scholight_migrator LOGIN PASSWORD '$MIGRATOR_PASSWORD';
               CREATE ROLE scholight_app LOGIN PASSWORD '$APP_PASSWORD';"

          for phase in before after-auth after-scholight; do
            docker run --rm --network host \
              -e PGPASSWORD="$POSTGRES_PASSWORD" \
              -v "$PWD/deploy/production/bootstrap-db.sql:/bootstrap-db.sql:ro" \
              "$POSTGRES_IMAGE" \
              psql -h 127.0.0.1 -U postgres -d sanchezcloud \
                -v app_role=scholight_app \
                -v auth_migrator_role=auth_migrator \
                -v product_migrator_role=scholight_migrator \
                -f /bootstrap-db.sql

            if [[ $phase == before ]]; then
              AUTH_DATABASE_URL="postgresql://auth_migrator:${AUTH_MIGRATOR_PASSWORD}@127.0.0.1:5432/sanchezcloud" \
                uv run --project .ci/cloud-auth cloud-auth migrate
              AUTH_DATABASE_URL="postgresql://auth_migrator:${AUTH_MIGRATOR_PASSWORD}@127.0.0.1:5432/sanchezcloud" \
                uv run --project .ci/cloud-auth cloud-auth check-schema
            elif [[ $phase == after-auth ]]; then
              for _ in 1 2; do
                docker run --rm --network host \
                  -e SCHOLIGHT_PG_HOST=127.0.0.1 \
                  -e SCHOLIGHT_PG_PORT=5432 \
                  -e SCHOLIGHT_PG_DATABASE=sanchezcloud \
                  -e SCHOLIGHT_PG_USER=scholight_migrator \
                  -e SCHOLIGHT_PG_PASSWORD="$MIGRATOR_PASSWORD" \
                  -e SCHOLIGHT_PG_SSL_ROOT_CERT=disable \
                  -e SCHOLIGHT_MIGRATIONS_DIR=/app/migrations \
                  scholight-api:ci \
                  /app/.venv/bin/scholight store migrate
              done
            fi
          done

          docker run --rm --network host \
            -e PGPASSWORD="$POSTGRES_PASSWORD" \
            "$POSTGRES_IMAGE" \
            psql -h 127.0.0.1 -U postgres -d sanchezcloud -tAc \
              "SELECT to_regclass('auth.schema_migrations') IS NOT NULL
                   AND to_regclass('scholight.schema_migrations') IS NOT NULL
                   AND to_regclass('scholight.search_history') IS NOT NULL
                   AND to_regclass('scholight.anonymous_daily_search_usage') IS NOT NULL
                   AND to_regclass('scholight.ingestion_sync_state') IS NOT NULL
                   AND to_regclass('scholight.ingestion_jobs') IS NOT NULL
                   AND to_regclass('auth.users') IS NOT NULL
                   AND to_regclass('auth.refresh_tokens') IS NOT NULL
                   AND NOT has_table_privilege(
                     'scholight_app', 'auth.users', 'DELETE'
                   )
                   AND NOT has_table_privilege(
                     'scholight_app', 'auth.refresh_tokens', 'DELETE'
                   )
                   AND NOT EXISTS (
                     SELECT 1 FROM scholight.schema_migrations WHERE checksum IS NULL
                   )
                   AND NOT EXISTS (
                     SELECT 1 FROM auth.schema_migrations WHERE checksum IS NULL
                   )
                   AND NOT EXISTS (
                     SELECT 1
                     FROM pg_tables
                     WHERE schemaname = 'public'
                   )" \
            | grep -qx t

          docker run --rm --network host \
            -e PGPASSWORD="$APP_PASSWORD" \
            "$POSTGRES_IMAGE" \
            psql -h 127.0.0.1 -U scholight_app -d sanchezcloud -v ON_ERROR_STOP=1 -c \
              "BEGIN;
               INSERT INTO auth.users (email, password_hash)
                 VALUES ('ci@example.invalid', 'fixture') RETURNING id;
               INSERT INTO scholight.search_history
                 (user_id, query_text, strength)
                 VALUES (currval('auth.users_id_seq'), 'ci', 'standard');
               INSERT INTO scholight.anonymous_daily_search_usage
                 (quota_date, ip_digest, strength) VALUES
                 (CURRENT_DATE, decode(repeat('00', 32), 'hex'), 'standard');
               INSERT INTO scholight.ingestion_sync_state (source)
                 VALUES ('ci');
               INSERT INTO scholight.ingestion_jobs
                 (arxiv_id, target_version, source, max_attempts)
                 VALUES ('2401.00001', 1, 'new', 8);
               UPDATE scholight.ingestion_jobs
                 SET status = 'succeeded'
                 WHERE arxiv_id = '2401.00001';
               ROLLBACK;"

          if docker run --rm --network host \
            -e PGPASSWORD="$APP_PASSWORD" \
            "$POSTGRES_IMAGE" \
            psql -h 127.0.0.1 -U scholight_app -d sanchezcloud -v ON_ERROR_STOP=1 -c \
              "CREATE TABLE public.app_role_must_not_create (id integer)"; then
            printf 'scholight_app unexpectedly has DDL privileges\n' >&2
            exit 1
          fi
