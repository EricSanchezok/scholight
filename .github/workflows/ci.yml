name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Git revision to verify
        required: false
        type: string
    secrets:
      IDENTITY_READER_PRIVATE_KEY:
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      SCHOLIGHT_DATA_ROOT: /tmp/scholight-ci
      SCHOLIGHT_DISABLE_DOTENV: "1"
      SCHOLIGHT_PG_HOST: 127.0.0.1
      SCHOLIGHT_PG_PORT: "5432"
      SCHOLIGHT_PG_DATABASE: scholight_test_ingestion
      SCHOLIGHT_PG_USER: postgres
      SCHOLIGHT_PG_PASSWORD: integration-test-password
      SCHOLIGHT_PG_SSL_ROOT_CERT: disable
      SCHOLIGHT_ZILLIZ_URI: http://127.0.0.1:9
      SCHOLIGHT_EMBEDDING_BASE_URL: http://127.0.0.1:9/v1
      SCHOLIGHT_TEST_DATABASE_URL: postgresql://postgres:integration-test-password@127.0.0.1:5432/scholight_test_ingestion
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: integration-test-password
          POSTGRES_DB: scholight_test_ingestion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d scholight_test_ingestion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 5s
    steps:
      - name: Check out Scholight
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Mint read-only SanchezCloud Identity token
        id: identity-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.IDENTITY_READER_APP_ID }}
          private-key: ${{ secrets.IDENTITY_READER_PRIVATE_KEY }}
          owner: EricSanchezok
          repositories: sanchezcloud-identity
          permission-contents: read
      - name: Configure read-only private dependency access
        env:
          IDENTITY_READ_TOKEN: ${{ steps.identity-token.outputs.token }}
        run: >-
          git config --global
          url."https://x-access-token:${IDENTITY_READ_TOKEN}@github.com/".insteadOf
          "https://github.com/"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.9.2"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --all-extras
      - name: Ruff lint
        run: uv run ruff check
      - name: Ruff format
        run: uv run ruff format --check
      - name: Mypy
        run: uv run mypy scholight
      - name: Install Web Extract Chromium
        run: uv run playwright install --with-deps chromium
      - name: Full backend test suite
        run: uv run pytest -m "" -v --tb=short
      - name: Bandit
        run: uv run bandit -c pyproject.toml -r scholight/ --severity-level medium
      - name: Vulture
        run: uv run vulture scholight/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out Scholight
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Mint read-only SanchezCloud Identity token
        id: identity-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.IDENTITY_READER_APP_ID }}
          private-key: ${{ secrets.IDENTITY_READER_PRIVATE_KEY }}
          owner: EricSanchezok
          repositories: sanchezcloud-identity
          permission-contents: read
      - name: Configure read-only private dependency access
        env:
          IDENTITY_READ_TOKEN: ${{ steps.identity-token.outputs.token }}
        run: >-
          git config --global
          url."https://x-access-token:${IDENTITY_READ_TOKEN}@github.com/".insteadOf
          "https://github.com/"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.9.2"
          enable-cache: true
      - name: Install locked backend dependencies for OpenAPI generation
        working-directory: .
        run: uv sync --frozen --all-extras
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify frontend
        run: npm run verify

  deployment-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: migration-test-password
          POSTGRES_DB: sanchezcloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sanchezcloud"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 5s
    steps:
      - name: Check out Scholight
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Mint read-only SanchezCloud Identity token
        id: identity-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.IDENTITY_READER_APP_ID }}
          private-key: ${{ secrets.IDENTITY_READER_PRIVATE_KEY }}
          owner: EricSanchezok
          repositories: sanchezcloud-identity
          permission-contents: read
      - name: Configure read-only private dependency access
        env:
          IDENTITY_READ_TOKEN: ${{ steps.identity-token.outputs.token }}
        run: >-
          git config --global
          url."https://x-access-token:${IDENTITY_READ_TOKEN}@github.com/".insteadOf
          "https://github.com/"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.9.2"
          enable-cache: true
      - name: Install pinned auth migration tool
        run: uv sync --frozen --all-extras
      - name: Validate ECS CloudFormation contracts
        run: >-
          uvx --from cfn-lint==1.44.0 cfn-lint
          deploy/ecs/scholight-foundation.yml
          deploy/ecs/scholight-production.yml
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Validate shell scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          sh -n frontend/runtime/render-docs.sh
          shellcheck -s sh frontend/runtime/render-docs.sh
      - name: Build frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
      - name: Build API image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/scholight-api/Dockerfile
          target: api
          push: false
          load: true
          tags: scholight-api:ci
          secrets: |
            github_token=${{ steps.identity-token.outputs.token }}
      - name: Verify API image import boundary
        run: |
          docker run --rm --user 0 --entrypoint /bin/sh scholight-api:ci -ec '
            test ! -e /opt/scholight-package
            ! command -v accelerate >/dev/null
            ! command -v pandoc >/dev/null
            ! command -v pdftotext >/dev/null
          '
          docker run --rm --entrypoint /app/.venv/bin/python scholight-api:ci -c 'import importlib.util; assert importlib.util.find_spec("markdownify") is None; assert importlib.util.find_spec("playwright") is None; import scholight.api.app; import scholight.api.extract_execution'
      - name: Build ingest image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/scholight-api/Dockerfile
          target: ingest
          push: false
          load: true
          tags: scholight-ingest:ci
      - name: Build Survey image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/scholight-api/Dockerfile
          target: survey
          push: false
          load: true
          tags: scholight-survey:ci
      - name: Build Web Extract image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/scholight-extract/Dockerfile
          push: false
      - name: Verify component image boundaries
        if: github.event_name != 'pull_request'
        run: |
          docker run --rm --user 0 --entrypoint /bin/sh scholight-ingest:ci -ec '
            test ! -e /opt/scholight-package
            ! command -v accelerate >/dev/null
            command -v pandoc >/dev/null
            command -v pdftotext >/dev/null
            /app/.venv/bin/python -c "import fitz; d=fitz.open(); p=d.new_page(); p.insert_text((72,72), \"Scholight PDF fallback\"); d.save(\"/tmp/fallback.pdf\")"
            pdftotext /tmp/fallback.pdf /tmp/fallback.txt
            grep -F "Scholight PDF fallback" /tmp/fallback.txt >/dev/null
          '
          docker run --rm --user 0 --entrypoint /bin/sh scholight-survey:ci -ec '
            test ! -e /opt/scholight-package
            test -x /usr/local/bin/accelerate
            /usr/local/bin/accelerate --help >/dev/null
            ! command -v uvicorn >/dev/null
            ! command -v pandoc >/dev/null
            ! command -v pdftotext >/dev/null
          '
      - name: Run hermetic Survey E2E
        if: github.event_name != 'pull_request'
        env:
          IDENTITY_READ_TOKEN: ${{ steps.identity-token.outputs.token }}
        run: |
          compose_file=tests/survey_e2e/compose.yaml
          cleanup() {
            docker compose -f "$compose_file" down -v --remove-orphans
          }
          trap cleanup EXIT

          docker build \
            --build-arg BASE_IMAGE=scholight-survey:ci \
            --secret id=github_token,env=IDENTITY_READ_TOKEN \
            -f tests/survey_e2e/Dockerfile \
            -t scholight-survey-e2e:ci \
            .
          docker compose -f "$compose_file" up -d
          driver_id=$(docker compose -f "$compose_file" ps -q driver)
          driver_exit=$(docker wait "$driver_id")
          docker compose -f "$compose_file" logs \
            --tail=200 \
            driver survey-draft-worker survey-worker
          test "$driver_exit" = 0
      - name: Smoke-test built backend migrations with least-privilege roles
        if: github.event_name != 'pull_request'
        env:
          POSTGRES_PASSWORD: migration-test-password
          AUTH_MIGRATOR_PASSWORD: auth-migrator-test-password
          MIGRATOR_PASSWORD: migrator-test-password
          APP_PASSWORD: app-test-password
          POSTGRES_IMAGE: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        run: |
          docker run --rm --network host \
            -e PGPASSWORD="$POSTGRES_PASSWORD" \
            "$POSTGRES_IMAGE" \
            psql -h 127.0.0.1 -U postgres -d sanchezcloud -v ON_ERROR_STOP=1 -c \
              "CREATE ROLE auth_migrator LOGIN PASSWORD '$AUTH_MIGRATOR_PASSWORD';
               CREATE ROLE scholight_migrator LOGIN PASSWORD '$MIGRATOR_PASSWORD';
               CREATE ROLE scholight_app LOGIN PASSWORD '$APP_PASSWORD';"

          for phase in before after-auth after-scholight; do
            docker run --rm --network host \
              -e PGPASSWORD="$POSTGRES_PASSWORD" \
              -v "$PWD/deploy/ecs/database-bootstrap.sql:/database-bootstrap.sql:ro" \
              "$POSTGRES_IMAGE" \
              psql -h 127.0.0.1 -U postgres -d sanchezcloud \
                -v app_role=scholight_app \
                -v auth_migrator_role=auth_migrator \
                -v product_migrator_role=scholight_migrator \
                -f /database-bootstrap.sql

            if [[ $phase == before ]]; then
              AUTH_DATABASE_URL="postgresql://auth_migrator:${AUTH_MIGRATOR_PASSWORD}@127.0.0.1:5432/sanchezcloud" \
                .venv/bin/sanchezcloud-identity migrate
              AUTH_DATABASE_URL="postgresql://auth_migrator:${AUTH_MIGRATOR_PASSWORD}@127.0.0.1:5432/sanchezcloud" \
                .venv/bin/sanchezcloud-identity check-schema
            elif [[ $phase == after-auth ]]; then
              for _ in 1 2; do
                docker run --rm --network host \
                  -e SCHOLIGHT_PG_HOST=127.0.0.1 \
                  -e SCHOLIGHT_PG_PORT=5432 \
                  -e SCHOLIGHT_PG_DATABASE=sanchezcloud \
                  -e SCHOLIGHT_PG_USER=scholight_migrator \
                  -e SCHOLIGHT_PG_PASSWORD="$MIGRATOR_PASSWORD" \
                  -e SCHOLIGHT_PG_SSL_ROOT_CERT=disable \
                  -e SCHOLIGHT_MIGRATIONS_DIR=/app/migrations \
                  scholight-api:ci \
                  /app/.venv/bin/scholight store migrate
              done
            fi
          done

          docker run --rm --network host \
            -e PGPASSWORD="$POSTGRES_PASSWORD" \
            "$POSTGRES_IMAGE" \
            psql -h 127.0.0.1 -U postgres -d sanchezcloud -tAc \
              "SELECT to_regclass('auth.schema_migrations') IS NOT NULL
                   AND to_regclass('scholight.schema_migrations') IS NOT NULL
                   AND to_regclass('scholight.search_history') IS NOT NULL
                   AND to_regclass('scholight.anonymous_daily_search_usage') IS NOT NULL
                   AND to_regclass('scholight.ingestion_sync_state') IS NOT NULL
                   AND to_regclass('scholight.ingestion_jobs') IS NOT NULL
                   AND to_regclass('auth.users') IS NOT NULL
                   AND to_regclass('auth.refresh_tokens') IS NOT NULL
                   AND to_regclass('auth.user_clients') IS NOT NULL
                   AND NOT has_table_privilege(
                     'scholight_app', 'auth.users', 'DELETE'
                   )
                   AND NOT has_table_privilege(
                     'scholight_app', 'auth.refresh_tokens', 'DELETE'
                   )
                   AND NOT has_table_privilege(
                     'scholight_app', 'auth.user_clients', 'DELETE'
                   )
                   AND NOT EXISTS (
                     SELECT 1 FROM scholight.schema_migrations WHERE checksum IS NULL
                   )
                   AND NOT EXISTS (
                     SELECT 1 FROM auth.schema_migrations WHERE checksum IS NULL
                   )
                   AND NOT EXISTS (
                     SELECT 1
                     FROM pg_tables
                     WHERE schemaname = 'public'
                   )" \
            | grep -qx t

          docker run --rm --network host \
            -e PGPASSWORD="$APP_PASSWORD" \
            "$POSTGRES_IMAGE" \
            psql -h 127.0.0.1 -U scholight_app -d sanchezcloud -v ON_ERROR_STOP=1 -c \
              "BEGIN;
               INSERT INTO auth.users (email, password_hash)
                 VALUES ('ci@example.invalid', 'fixture') RETURNING id;
               INSERT INTO scholight.search_history
                 (user_id, query_text, strength)
                 VALUES (currval('auth.users_id_seq'), 'ci', 'standard');
               INSERT INTO scholight.anonymous_daily_search_usage
                 (quota_date, ip_digest, strength) VALUES
                 (CURRENT_DATE, decode(repeat('00', 32), 'hex'), 'standard');
               INSERT INTO scholight.ingestion_sync_state (source)
                 VALUES ('ci');
               INSERT INTO scholight.ingestion_jobs
                 (arxiv_id, target_version, source, max_attempts)
                 VALUES ('2401.00001', 1, 'new', 8);
               UPDATE scholight.ingestion_jobs
                 SET status = 'succeeded'
                 WHERE arxiv_id = '2401.00001';
               INSERT INTO scholight.survey_daily_usage
                 (user_id, usage_date, succeeded_count)
                 VALUES (currval('auth.users_id_seq'), CURRENT_DATE, 1);
               INSERT INTO scholight.surveys
                 (id, user_id, client_request_id, initial_request, status, quota_date,
                  quota_state, finished_at)
                 VALUES ('00000000-0000-0000-0000-000000000101',
                         currval('auth.users_id_seq'),
                         '00000000-0000-0000-0000-000000000102',
                         'CI artifact cleanup contract', 'succeeded', CURRENT_DATE,
                         'consumed', now());
               INSERT INTO scholight.survey_drafts
                 (id, survey_id, client_request_id, revision, source, user_message,
                  markdown, status, finished_at)
                 VALUES ('00000000-0000-0000-0000-000000000103',
                         '00000000-0000-0000-0000-000000000101',
                         '00000000-0000-0000-0000-000000000104', 1, 'manual',
                         'CI Draft', '# CI Draft', 'ready', now());
               INSERT INTO scholight.survey_jobs
                 (id, survey_id, approved_draft_id, client_request_id, status,
                  terminal_outcome, storage_bucket, storage_prefix, manifest_key,
                  finished_at)
                 VALUES ('00000000-0000-0000-0000-000000000105',
                         '00000000-0000-0000-0000-000000000101',
                         '00000000-0000-0000-0000-000000000103',
                         '00000000-0000-0000-0000-000000000106', 'finished',
                         'succeeded', 'ci-private-bucket',
                         'surveys/v1/' || currval('auth.users_id_seq') ||
                           '/00000000-0000-0000-0000-000000000105',
                         'surveys/v1/' || currval('auth.users_id_seq') ||
                           '/00000000-0000-0000-0000-000000000105/manifest.json',
                         now());
               DELETE FROM scholight.surveys
                 WHERE id = '00000000-0000-0000-0000-000000000101';
               DO \$contract\$
               BEGIN
                 IF NOT EXISTS (
                   SELECT 1 FROM scholight.survey_artifact_cleanup_outbox
                   WHERE source_job_id = '00000000-0000-0000-0000-000000000105'
                 ) THEN
                   RAISE EXCEPTION 'Survey artifact cleanup outbox contract failed';
                 END IF;
               END
               \$contract\$;
               ROLLBACK;"

          docker run --rm --network host \
            -e SCHOLIGHT_PG_HOST=127.0.0.1 \
            -e SCHOLIGHT_PG_PORT=5432 \
            -e SCHOLIGHT_PG_DATABASE=sanchezcloud \
            -e SCHOLIGHT_PG_USER=scholight_app \
            -e SCHOLIGHT_PG_PASSWORD="$APP_PASSWORD" \
            -v "$PWD/tests/deploy/identity_runtime_smoke.py:/identity-runtime-smoke.py:ro" \
            scholight-api:ci \
            /app/.venv/bin/python /identity-runtime-smoke.py

          if docker run --rm --network host \
            -e PGPASSWORD="$APP_PASSWORD" \
            "$POSTGRES_IMAGE" \
            psql -h 127.0.0.1 -U scholight_app -d sanchezcloud -v ON_ERROR_STOP=1 -c \
              "CREATE TABLE public.app_role_must_not_create (id integer)"; then
            printf 'scholight_app unexpectedly has DDL privileges\n' >&2
            exit 1
          fi
