name: SanchezCloud Identity compatibility

on:
  workflow_dispatch:
    inputs:
      identity_ref:
        description: Immutable sanchezcloud-identity candidate commit SHA
        required: true
        type: string
      version:
        description: Candidate semantic version without a floating ref
        required: true
        type: string
      schema_version:
        description: Candidate auth schema version
        required: true
        type: string
      correlation_id:
        description: Release-candidate correlation identifier
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: identity-compat-${{ inputs.correlation_id }}
  cancel-in-progress: false

jobs:
  identity-contract:
    name: Required identity compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: identity-compat-password
          POSTGRES_DB: sanchezcloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sanchezcloud"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 5s
    env:
      SCHOLIGHT_DISABLE_DOTENV: "1"
      SCHOLIGHT_DATA_ROOT: /tmp/scholight-identity-compat
      SCHOLIGHT_PG_HOST: 127.0.0.1
      SCHOLIGHT_PG_PORT: "5432"
      SCHOLIGHT_PG_DATABASE: sanchezcloud
      SCHOLIGHT_PG_USER: postgres
      SCHOLIGHT_PG_PASSWORD: identity-compat-password
      SCHOLIGHT_PG_SSL_ROOT_CERT: disable
      SCHOLIGHT_ZILLIZ_URI: http://127.0.0.1:9
      SCHOLIGHT_EMBEDDING_BASE_URL: http://127.0.0.1:9/v1
    steps:
      - name: Check out Scholight
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Mint read-only SanchezCloud Identity token
        id: identity-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.IDENTITY_READER_APP_ID }}
          private-key: ${{ secrets.IDENTITY_READER_PRIVATE_KEY }}
          owner: EricSanchezok
          repositories: sanchezcloud-identity
          permission-contents: read
      - name: Check out candidate SanchezCloud Identity
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: EricSanchezok/sanchezcloud-identity
          ref: ${{ inputs.identity_ref }}
          token: ${{ steps.identity-token.outputs.token }}
          path: .ci/sanchezcloud-identity
          persist-credentials: false
      - name: Configure read-only private dependency access
        env:
          IDENTITY_READ_TOKEN: ${{ steps.identity-token.outputs.token }}
        run: >-
          git config --global
          url."https://x-access-token:${IDENTITY_READ_TOKEN}@github.com/".insteadOf
          "https://github.com/"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.9.2"
          enable-cache: true
      - name: Install locked consumer and candidate SDK
        run: |
          uv sync --frozen --extra dev
          uv pip install --python .venv/bin/python --reinstall ".ci/sanchezcloud-identity[aliyun]"
      - name: Verify candidate identity metadata
        env:
          EXPECTED_REF: ${{ inputs.identity_ref }}
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_SCHEMA_VERSION: ${{ inputs.schema_version }}
        run: |
          resolved_ref=$(git -C .ci/sanchezcloud-identity rev-parse HEAD)
          test "$resolved_ref" = "$EXPECTED_REF"
          uv run python - <<'PY'
          import os
          import sanchezcloud_identity

          expected_version = os.environ["EXPECTED_VERSION"].removeprefix("v")
          assert sanchezcloud_identity.__version__ == expected_version
          assert sanchezcloud_identity.AUTH_SCHEMA_VERSION == int(
              os.environ["EXPECTED_SCHEMA_VERSION"]
          )
          PY
      - name: Verify Scholight identity integration
        run: >-
          uv run pytest -q
          scholight/api/tests/test_auth_config.py
          scholight/api/tests/test_search_auth.py
          scholight/api/tests/test_sessions.py
      - name: Verify candidate schema contract
        env:
          AUTH_DATABASE_URL: postgresql://postgres:identity-compat-password@127.0.0.1:5432/sanchezcloud
          PGPASSWORD: identity-compat-password
        run: |
          psql -h 127.0.0.1 -U postgres -d sanchezcloud \
            -v ON_ERROR_STOP=1 -c "CREATE SCHEMA auth AUTHORIZATION postgres"
          uv run sanchezcloud-identity migrate
          uv run sanchezcloud-identity migrate
          uv run sanchezcloud-identity check-schema
          test "$(uv run sanchezcloud-identity schema-version)" = "${{ inputs.schema_version }}"
      - name: Build Scholight with the candidate SDK
        env:
          DOCKER_BUILDKIT: "1"
          IDENTITY_READ_TOKEN: ${{ steps.identity-token.outputs.token }}
          IDENTITY_REF: ${{ inputs.identity_ref }}
        run: |
          docker build \
            --secret id=github_token,env=IDENTITY_READ_TOKEN \
            --build-arg SANCHEZCLOUD_IDENTITY_REVISION="$IDENTITY_REF" \
            --build-arg TARGETARCH=amd64 \
            -f docker/scholight-api/Dockerfile \
            -t scholight-identity-compat:ci .
          docker run --rm --entrypoint /app/.venv/bin/python \
            scholight-identity-compat:ci -c \
            'import sanchezcloud_identity as identity; print(identity.__version__)'
      - name: Record compatibility result
        if: always()
        run: |
          {
            echo "### SanchezCloud Identity compatibility"
            echo "- Consumer: Scholight (required)"
            echo "- Candidate: \`${{ inputs.version }}\` / \`${{ inputs.identity_ref }}\`"
            echo "- Schema: \`${{ inputs.schema_version }}\`"
            echo "- Correlation: \`${{ inputs.correlation_id }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
