[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scholight"
version = "0.1.0"
description = "AI-focused academic research engine with paper search and general web extraction"
requires-python = ">=3.11"
dependencies = [
    "click>=8",
    "httpx>=0.27",
    "pydantic[email]>=2",
    "pydantic-settings>=2",
    "asyncpg>=0.29",
    "structlog>=24",
    "tenacity>=8",
]
[project.optional-dependencies]
api = [
    "boto3>=1.35,<2",
    "cryptography>=50.0.0",
    "sanchezcloud-identity[aliyun,avatar]",
    "grpcio>=1.60,<2",
    "pymilvus>=2.4",
    "fastapi>=0.115",
    "mcp>=1.28,<2",
    "uvicorn[standard]>=0.30",
    "PyJWT>=2.10",
]
extract = [
    "aiohttp>=3.14.3",
    "fastapi>=0.115",
    "markdownify>=0.13,<2",
    "playwright>=1.52,<2",
    "trafilatura>=2.0,<3",
    "uvicorn[standard]>=0.30",
]
ingest = [
    "grpcio>=1.60,<2",
    "pymilvus>=2.4",
    "pylatexenc>=2",
    "pymupdf4llm>=1.27.2.3",
]
survey = [
    "alibabacloud-credentials>=0.3.7",
    "alibabacloud-dm20151123>=1.2.2",
    "beautifulsoup4>=4.12",
    "boto3>=1.35,<2",
    "cryptography>=50.0.0",
    "graphviz>=0.20",
    "markdownify>=0.13,<2",
    "matplotlib>=3.8",
    "pymupdf4llm>=1.27.2.3",
    "PyJWT>=2.10",
]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.14",
    "pre-commit>=4",
    "bandit[toml]>=1.8",
    "vulture>=2.14",
    "pip-audit>=2.8",
]

[project.scripts]
scholight = "scholight.cli:cli"

[tool.setuptools.packages.find]
include = ["scholight*"]

[tool.setuptools.package-data]
"scholight.survey" = [
    "workflow/AGENTS.md",
    "workflow/rcm.toml",
    "workflow/prompts/*.txt",
    "workflow/rcm/*.rcm",
    "workflow/schema/*.md",
]


# ── Ruff ─────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["scripts/archive"]

[tool.ruff.lint]
select = [
    # Base
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes (must)
    # Style & modernization
    "I",      # isort — import ordering
    "UP",     # pyupgrade — modern Python syntax
    "N",      # pep8-naming
    # Bug detection
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "PIE",    # flake8-pie
    "RUF",    # Ruff-specific rules
    # Code quality
    "ARG",    # flake8-unused-arguments
    "EM",     # flake8-errmsg
    "RET",    # flake8-return
    "RSE",    # flake8-raise
    "T20",    # flake8-print
    "SLF",    # flake8-self
    # Type checking hints
    "TCH",    # flake8-type-checking
]
ignore = [
    "E501",    # Line length handled by formatter
    "B008",    # Allow function-call defaults in FastAPI deps
    "B905",    # zip() strict=None is intentional pre-3.10 compat
    "ARG002",  # Allow unused self/cls args
    "N806",    # Uppercase math variables (T, N) are conventional
    "RUF003",  # Em-dashes and × in comments are intentional
    "RUF022",  # __all__ sorted by logical group, not alphabetically
    "TCH",     # TYPE_CHECKING guards handled manually
    "EM",      # Exception string literals are clearer than extracted vars
]

[tool.ruff.lint.mccabe]
max-complexity = 14

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["scholight"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]                    # re-exports are intentional
"**/tests/**/*.py" = ["ARG", "S101", "SLF", "SIM"]  # tests access private, nested with is fine
"scripts/**/*.py" = ["T201", "RUF002", "F821", "SLF"]       # print ok; Chinese ok; type stubs deferred; tuners monkeypatch

[tool.ruff.format]
docstring-code-format = true


# ── Mypy ──────────────────────────────────────────────────────────────

[tool.mypy]
strict = true
ignore_missing_imports = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = ["tests.*", "scholight.pipeline.tests.*", "scholight.search.*.tests.*", "scholight.store.tests.*", "scholight.web_extract.tests.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["scholight.pipeline.pdf_md"]
ignore_errors = true


# ── Bandit ────────────────────────────────────────────────────────────

[tool.bandit]
exclude_dirs = ["tests", ".venv", "scripts/archive"]


# ── Vulture ───────────────────────────────────────────────────────────

[tool.vulture]
paths = ["scholight/"]
exclude = ["*test_*.py", "*__init__.py"]
min_confidence = 80


# ── Pytest ────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["scholight", "tests"]
addopts = ["-rXs", "--strict-config", "--strict-markers", "-m", "not pg_integration"]
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "browser_integration: launches a real local Chromium instance",
    "pg_integration: requires SCHOLIGHT_TEST_DATABASE_URL pointing to an isolated PostgreSQL database",
]


# ── Coverage ──────────────────────────────────────────────────────────

[tool.coverage.run]
branch = true
source_pkgs = ["scholight"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
    "raise NotImplementedError",
    "class .*\bProtocol\b",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
]

[tool.uv.sources]
# Immutable identity/session SDK revision; products never depend on a moving branch.
sanchezcloud-identity = { git = "https://github.com/EricSanchezok/sanchezcloud-identity.git", tag = "v0.5.2" }
