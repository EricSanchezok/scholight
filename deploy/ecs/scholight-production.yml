            {"type":"metric","x":12,"y":0,"width":12,"height":6,"properties":{"title":"ALB requests and latency","region":"${AWS::Region}","metrics":[["AWS/ApplicationELB","RequestCount","LoadBalancer","${LoadBalancerName}"],[".","TargetResponseTime",".",".",{"stat":"p95"}]]}},
            {"type":"metric","x":0,"y":6,"width":12,"height":6,"properties":{"title":"Extract capacity","region":"${AWS::Region}","metrics":[["AWS/ECS","CPUUtilization","ServiceName","${ExtractServiceName}","ClusterName","${ClusterName}"],[".","MemoryUtilization",".",".",".","."]]}},
            {"type":"metric","x":12,"y":6,"width":12,"height":6,"properties":{"title":"Ingestion queue","region":"${AWS::Region}","metrics":[["Scholight/Production","IngestionBacklog","service","paper-ingest"],[".","IngestionOldestAge",".","."],[".","IngestionDeadTotal",".","."]]}},
            {"type":"metric","x":0,"y":12,"width":12,"height":6,"properties":{"title":"Survey global capacity","region":"${AWS::Region}","metrics":[["Scholight/Production","SurveyDraftOutstanding","service","survey-draft-worker"],[".","SurveyDraftRunning",".","."],[".","SurveyJobOutstanding","service","survey-full-worker"],[".","SurveyJobRunning",".","."]]}},
            {"type":"metric","x":12,"y":12,"width":12,"height":6,"properties":{"title":"Survey queue and user saturation","region":"${AWS::Region}","metrics":[["Scholight/Production","SurveyDraftOldestQueuedAge","service","survey-draft-worker"],[".","SurveyJobOldestQueuedAge","service","survey-full-worker"],[".","SurveyDraftUsersAtConcurrencyLimit","service","survey-draft-worker"],[".","SurveyJobUsersAtConcurrencyLimit","service","survey-full-worker"]]}},
            {"type":"metric","x":0,"y":18,"width":12,"height":6,"properties":{"title":"Survey worker tasks","region":"${AWS::Region}","metrics":[["ECS/ContainerInsights","RunningTaskCount","ClusterName","${ClusterName}","ServiceName","${SurveyDraftServiceName}"],[".",".",".",".",".","${SurveyFullServiceName}"]]}},
            {"type":"metric","x":12,"y":18,"width":12,"height":6,"properties":{"title":"Survey reliability and protection","region":"${AWS::Region}","metrics":[["Scholight/Production","SurveyRuntimeFailure","service","survey-worker"],[".","SurveyProviderThrottled",".","."],[".","SurveyProviderThrottled","service","survey-draft-worker"],[".","SurveyProviderRetry",".","."],[".","SurveyProviderRetry","service","survey-full-worker"],[".","SurveyTaskProtectionFailure","service","survey-draft-worker"],[".",".",".","survey-full-worker"],[".","SurveyEmailNotificationDead","service","survey-worker"]]}},
            {"type":"metric","x":0,"y":24,"width":12,"height":6,"properties":{"title":"Survey database latency","region":"${AWS::Region}","metrics":[["Scholight/Production","SurveyDraftClaimLatency","service","survey-draft-worker",{"stat":"p95"}],[".","SurveyDraftHeartbeatLatency",".",".",{"stat":"p95"}],[".","SurveyJobClaimLatency","service","survey-full-worker",{"stat":"p95"}],[".","SurveyJobHeartbeatLatency",".",".",{"stat":"p95"}]]}},
            {"type":"metric","x":12,"y":24,"width":12,"height":6,"properties":{"title":"PostgreSQL capacity","region":"${AWS::Region}","metrics":[["AWS/RDS","DatabaseConnections","DBInstanceIdentifier","${DatabaseInstanceIdentifier}"],[".","CPUUtilization",".","."],[".","FreeableMemory",".",".",{"yAxis":"right"}]]}},
            {"type":"metric","x":0,"y":30,"width":12,"height":6,"properties":{"title":"Full Survey compute","region":"${AWS::Region}","metrics":[["AWS/ECS","CPUUtilization","ServiceName","${SurveyFullServiceName}","ClusterName","${ClusterName}"],[".","MemoryUtilization",".",".",".","."]]}},
            {"type":"metric","x":12,"y":30,"width":12,"height":6,"properties":{"title":"Full Survey storage","region":"${AWS::Region}","metrics":[["ECS/ContainerInsights","EphemeralStorageUtilized","ClusterName","${ClusterName}","ServiceName","${SurveyFullServiceName}"],[".","EphemeralStorageReserved",".",".",".","."]]}},
            {"type":"metric","x":0,"y":36,"width":24,"height":6,"properties":{"title":"Survey publication, finalization, and provider canaries","region":"${AWS::Region}","metrics":[["Scholight/Production","SurveyPublicationCount","service","survey-worker","outcome","succeeded"],[".","SurveyPublicationCount",".",".",".","degraded"],[".","SurveyPublicationCount",".",".",".","failed"],[".","SurveyFinalizationFailure","service","survey-worker"],[".","SurveyModelTerminalFailure",".","."],[".","SurveyModelCanaryCount","service","survey-model-canary","outcome","ok"],[".","SurveyModelCanaryCount",".",".",".","failed"],[".","SurveyImageGenerationCount","service","survey-full-worker","outcome","succeeded"],[".","SurveyImageGenerationCount",".",".",".","failed"],[".","SurveyImageCanaryCount","service","survey-image-canary","outcome","ok"],[".","SurveyImageCanaryCount",".",".",".","failed"]]}},
            {"type":"metric","x":0,"y":42,"width":24,"height":6,"properties":{"title":"Survey full-text evidence","region":"${AWS::Region}","metrics":[["Scholight/Production","SurveyFullTextCoverage","service","survey-full-worker"],[".","SurveyPaperEvidenceCount",".",".","outcome","full_text"],[".","SurveyPaperEvidenceCount",".",".",".","partial"],[".","SurveyPaperEvidenceCount",".",".",".","abstract_only"],[".","SurveyFullTextRuntimeFailure","service","survey-worker"],[".","SurveyFullTextCanaryCount","service","survey-fulltext-canary","outcome","failed"]]}},
            {"type":"log","x":0,"y":48,"width":24,"height":6,"properties":{"title":"Recent Survey errors and degraded publications","region":"${AWS::Region}","query":"SOURCE '/sanchezcloud/scholight/survey' | fields @timestamp, level, event, job_id, error_code, http_status, retryable, duration_ms | filter level in ['error','critical'] or event in ['survey_model_completion_failed','survey_full_text_evidence_failed','survey_report_published_degraded'] | sort @timestamp desc | limit 50"}}
          ]}
        - ApiServiceName: !GetAtt ApiService.Name
