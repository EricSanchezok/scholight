            - { Name: SCHOLIGHT_PG_PORT, ValueFrom: !Sub ["${Secret}:port::", { Secret: !ImportValue sanchezcloud-scholight-database-runtime-secret-arn }] }
            - { Name: SCHOLIGHT_PG_DATABASE, ValueFrom: !Sub ["${Secret}:dbname::", { Secret: !ImportValue sanchezcloud-scholight-database-runtime-secret-arn }] }
            - { Name: SCHOLIGHT_PG_USER, ValueFrom: !Sub ["${Secret}:username::", { Secret: !ImportValue sanchezcloud-scholight-database-runtime-secret-arn }] }
            - { Name: SCHOLIGHT_PG_PASSWORD, ValueFrom: !Sub ["${Secret}:password::", { Secret: !ImportValue sanchezcloud-scholight-database-runtime-secret-arn }] }
            - { Name: DEEPSEEK_API_KEY, ValueFrom: !Sub ["${Secret}:deepseek_api_key::", { Secret: !ImportValue sanchezcloud-scholight-survey-secret-arn }] }
            - { Name: IMAGE_GEN_API_KEY, ValueFrom: !Sub ["${Secret}:image_gen_api_key::", { Secret: !ImportValue sanchezcloud-scholight-survey-secret-arn }] }
            - { Name: SCHOLIGHT_SURVEY_MCP_JWT_SECRET, ValueFrom: !Sub ["${Secret}:survey_mcp_jwt_secret::", { Secret: !ImportValue sanchezcloud-scholight-core-secret-arn }] }
            - { Name: SCHOLIGHT_ALIYUN_DM_ACCESS_KEY_ID, ValueFrom: !Sub ["${Secret}:aliyun_access_key_id::", { Secret: !ImportValue sanchezcloud-scholight-mail-secret-arn }] }
            - { Name: SCHOLIGHT_ALIYUN_DM_ACCESS_KEY_SECRET, ValueFrom: !Sub ["${Secret}:aliyun_access_key_secret::", { Secret: !ImportValue sanchezcloud-scholight-mail-secret-arn }] }
            - { Name: SCHOLIGHT_ALIYUN_DM_ACCOUNT_NAME, ValueFrom: !Sub ["${Secret}:aliyun_account_name::", { Secret: !ImportValue sanchezcloud-scholight-mail-secret-arn }] }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref SurveyLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: full

  MigrationTaskDefinition:
