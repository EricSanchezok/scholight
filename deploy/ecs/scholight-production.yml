AWSTemplateFormatVersion: "2010-09-09"
Description: Scholight public web, search, extraction, ingestion, and Survey workloads on Fargate

Parameters:
  DomainName:
    Type: String
    AllowedPattern: "^[A-Za-z0-9.-]+$"
  CertificateArn:
    Type: String
    AllowedPattern: "^arn:[^:]+:acm:[^:]+:[0-9]{12}:certificate/[0-9a-f-]+$"
  RdsSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  DatabaseInstanceIdentifier:
    Type: String
    Default: sanchezcloud-pg
    AllowedPattern: "^[a-z][a-z0-9-]{0,62}$"
  WebImage:
    Type: String
    AllowedPattern: "^[0-9]{12}\\.dkr\\.ecr\\.[a-z0-9-]+\\.amazonaws\\.com/[a-z0-9/_-]+@sha256:[0-9a-f]{64}$"
  ApiImage:
    Type: String
    AllowedPattern: "^[0-9]{12}\\.dkr\\.ecr\\.[a-z0-9-]+\\.amazonaws\\.com/[a-z0-9/_-]+@sha256:[0-9a-f]{64}$"
  ExtractImage:
    Type: String
    AllowedPattern: "^[0-9]{12}\\.dkr\\.ecr\\.[a-z0-9-]+\\.amazonaws\\.com/[a-z0-9/_-]+@sha256:[0-9a-f]{64}$"
  IngestImage:
    Type: String
    AllowedPattern: "^[0-9]{12}\\.dkr\\.ecr\\.[a-z0-9-]+\\.amazonaws\\.com/[a-z0-9/_-]+@sha256:[0-9a-f]{64}$"
  SurveyImage:
    Type: String
    AllowedPattern: "^[0-9]{12}\\.dkr\\.ecr\\.[a-z0-9-]+\\.amazonaws\\.com/[a-z0-9/_-]+@sha256:[0-9a-f]{64}$"
  ApplicationEnabled:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Keep all public and private services at zero during first database bootstrap
  SurveyRuntimeEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  SurveyPublicMode:
    Type: String
    Default: "off"
    AllowedValues: ["off", "all"]
  ImageGenApiUrl:
    Type: String
    Default: ""
    AllowedPattern: "^$|^https://[A-Za-z0-9._~:/?#@!$&'()*+,;=%-]+$"
    Description: Optional reviewed image gateway override; empty uses the pinned RCM default
  ImageGenTrustedHosts:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[A-Za-z0-9.-]+(,[A-Za-z0-9.-]+)*$"
    Description: Exact comma-separated HTTPS image result hosts beyond the gateway host
  SchedulerState:
    Type: String
    Default: DISABLED
    AllowedValues: [ENABLED, DISABLED]
  SurveyDraftMaxTasks:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 8
    Description: Staged Draft worker ceiling; raise only after the previous capacity stage passes
  SurveyFullMaxTasks:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 8
    Description: Staged Full Survey worker ceiling; two jobs run per task

Rules:
  SurveyRequiresApplication:
    Assertions:
      - Assert: !Or
          - !Equals [!Ref SurveyRuntimeEnabled, "false"]
          - !Equals [!Ref ApplicationEnabled, "true"]
        AssertDescription: Survey workers require the Scholight application to be enabled
  PublicSurveyRequiresWorkers:
    Assertions:
      - Assert: !Or
          - !Equals [!Ref SurveyPublicMode, "off"]
          - !Equals [!Ref SurveyRuntimeEnabled, "true"]
        AssertDescription: Survey public mode all requires Survey workers to be enabled

Conditions:
  RunApplication: !Equals [!Ref ApplicationEnabled, "true"]
  RunSurveyWorkers: !And
    - !Equals [!Ref ApplicationEnabled, "true"]
    - !Equals [!Ref SurveyRuntimeEnabled, "true"]

Resources:
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTP and HTTPS ingress for Scholight
      VpcId: !ImportValue sanchezcloud-production-vpc-id
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
      SecurityGroupEgress: []
      Tags:
        - { Key: Name, Value: sanchezcloud-scholight-alb }
        - { Key: System, Value: SanchezCloud }
        - { Key: Product, Value: Scholight }
        - { Key: Environment, Value: production }

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Scholight Fargate tasks
      VpcId: !ImportValue sanchezcloud-production-vpc-id
      SecurityGroupIngress: []
      SecurityGroupEgress:
        - { IpProtocol: -1, CidrIp: 0.0.0.0/0 }
      Tags:
        - { Key: Name, Value: sanchezcloud-scholight-tasks }
        - { Key: System, Value: SanchezCloud }
        - { Key: Product, Value: Scholight }
        - { Key: Environment, Value: production }

  AlbToApiEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      Description: Search API traffic from the public load balancer
      GroupId: !Ref AlbSecurityGroup
      IpProtocol: tcp
      FromPort: 8000
      ToPort: 8000
      DestinationSecurityGroupId: !Ref TaskSecurityGroup

  AlbToWebEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      Description: Web traffic from the public load balancer
      GroupId: !Ref AlbSecurityGroup
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      DestinationSecurityGroupId: !Ref TaskSecurityGroup

  ApiIngressFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Search API traffic from the public load balancer
      GroupId: !Ref TaskSecurityGroup
      IpProtocol: tcp
      FromPort: 8000
      ToPort: 8000
      SourceSecurityGroupId: !Ref AlbSecurityGroup

  WebIngressFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Web traffic from the public load balancer
      GroupId: !Ref TaskSecurityGroup
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      SourceSecurityGroupId: !Ref AlbSecurityGroup

  ExtractIngressFromTasks:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Private extract traffic from Scholight tasks
      GroupId: !Ref TaskSecurityGroup
      IpProtocol: tcp
      FromPort: 8001
      ToPort: 8001
      SourceSecurityGroupId: !Ref TaskSecurityGroup

  RdsIngressFromScholight:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: PostgreSQL from Scholight Fargate tasks only
      GroupId: !Ref RdsSecurityGroupId
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref TaskSecurityGroup

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: sanchezcloud-scholight
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      SecurityGroups: [!Ref AlbSecurityGroup]
      Subnets:
        - !ImportValue sanchezcloud-production-public-subnet-1
        - !ImportValue sanchezcloud-production-public-subnet-2
      LoadBalancerAttributes:
        - { Key: deletion_protection.enabled, Value: "true" }
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: "true" }
        - { Key: routing.http2.enabled, Value: "true" }
      Tags:
        - { Key: System, Value: SanchezCloud }
        - { Key: Product, Value: Scholight }
        - { Key: Environment, Value: production }

  WebTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: sanchezcloud-scholight-web
      VpcId: !ImportValue sanchezcloud-production-vpc-id
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      HealthCheckPath: /healthz
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: 200 }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "30" }

  ApiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: sanchezcloud-scholight-api
      VpcId: !ImportValue sanchezcloud-production-vpc-id
      TargetType: ip
      Protocol: HTTP
      Port: 8000
      HealthCheckPath: /readyz
      HealthCheckIntervalSeconds: 20
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: 200 }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "30" }

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig: { Protocol: HTTPS, Port: "443", StatusCode: HTTP_301 }

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates: [{ CertificateArn: !Ref CertificateArn }]
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref WebTargetGroup

  ApiListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 10
      Conditions:
        - Field: path-pattern
          PathPatternConfig: { Values: [/api, /api/*] }
      Transforms:
        - Type: url-rewrite
          UrlRewriteConfig:
            Rewrites:
              - Regex: ^/api/?(.*)$
                Replace: /$1
      Actions:
        - Type: forward
          TargetGroupArn: !Ref ApiTargetGroup

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: SanchezCloudScholightTaskExecutionRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadScholightRuntimeSecrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [secretsmanager:DescribeSecret, secretsmanager:GetSecretValue]
                Resource:
                  - !ImportValue sanchezcloud-scholight-database-runtime-secret-arn
                  - !ImportValue sanchezcloud-scholight-database-migrator-secret-arn
                  - !ImportValue sanchezcloud-scholight-core-secret-arn
                  - !ImportValue sanchezcloud-scholight-mcp-delegation-secret-arn
                  - !ImportValue sanchezcloud-scholight-search-secret-arn
                  - !ImportValue sanchezcloud-scholight-survey-secret-arn
                  - !ImportValue sanchezcloud-scholight-mail-secret-arn
              - Effect: Allow
                Action: kms:Decrypt
                Resource: !ImportValue sanchezcloud-scholight-configuration-key-arn
                Condition:
                  StringEquals:
                    "kms:ViaService": !Sub secretsmanager.${AWS::Region}.${AWS::URLSuffix}

  ApiTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: SanchezCloudScholightApiTaskRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReadSurveyArtifacts
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  Fn::Sub:
                    - ${BucketArn}/surveys/*
                    - BucketArn: !ImportValue sanchezcloud-scholight-artifact-bucket-arn
              - Effect: Allow
                Action: [s3:ListBucket]
                Resource: !ImportValue sanchezcloud-scholight-artifact-bucket-arn
                Condition: { StringLike: { "s3:prefix": [surveys/*] } }
              - Effect: Allow
                Action: kms:Decrypt
                Resource: !ImportValue sanchezcloud-scholight-artifact-key-arn
        - PolicyName: ReadSharedProfileAvatars
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:${AWS::Partition}:s3:::sanchezcloud-account-avatars-${AWS::AccountId}-${AWS::Region}/auth/avatars/v1/*
              - Effect: Allow
                Action: kms:Decrypt
                Resource: !Sub arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*
                Condition:
                  StringEquals:
                    "kms:ViaService": !Sub s3.${AWS::Region}.${AWS::URLSuffix}
                  StringLike:
                    "kms:EncryptionContext:aws:s3:arn": !Sub arn:${AWS::Partition}:s3:::sanchezcloud-account-avatars-${AWS::AccountId}-${AWS::Region}/auth/avatars/v1/*

  SurveyTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: SanchezCloudScholightSurveyTaskRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ManageSurveyArtifacts
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:AbortMultipartUpload]
                Resource:
                  Fn::Sub:
                    - ${BucketArn}/surveys/*
                    - BucketArn: !ImportValue sanchezcloud-scholight-artifact-bucket-arn
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !ImportValue sanchezcloud-scholight-artifact-bucket-arn
                Condition: { StringLike: { "s3:prefix": [surveys/*] } }
              - Effect: Allow
                Action: [kms:Decrypt, kms:Encrypt, kms:GenerateDataKey]
                Resource: !ImportValue sanchezcloud-scholight-artifact-key-arn
        - PolicyName: SurveyTaskScaleInProtection
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [ecs:GetTaskProtection, ecs:UpdateTaskProtection]
                Resource: !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task/sanchezcloud-production/*

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: SanchezCloudScholightSchedulerRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RunBoundedScholightTasks
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecs:RunTask
                Resource: [!Ref IngestTaskDefinition, !Ref MetadataTaskDefinition]
                Condition:
                  ArnEquals:
                    ecs:cluster: !ImportValue sanchezcloud-production-cluster-arn
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt ExecutionRole.Arn

  WebLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: /sanchezcloud/scholight/web, RetentionInDays: 30 }
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: /sanchezcloud/scholight/api, RetentionInDays: 30 }
  ExtractLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: /sanchezcloud/scholight/extract, RetentionInDays: 30 }
  IngestLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: /sanchezcloud/scholight/ingest, RetentionInDays: 30 }
  SurveyLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: /sanchezcloud/scholight/survey, RetentionInDays: 30 }
  MetadataLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: /sanchezcloud/scholight/metadata-sync, RetentionInDays: 30 }
  MigrationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: /sanchezcloud/scholight/migration, RetentionInDays: 90 }

  WebTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: sanchezcloud-scholight-web
      Cpu: "256"
      Memory: "512"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      RuntimePlatform: { CpuArchitecture: X86_64, OperatingSystemFamily: LINUX }
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      ContainerDefinitions:
        - Name: web
          Image: !Ref WebImage
          Essential: true
          PortMappings:
            - { Name: web, ContainerPort: 8080, Protocol: tcp, AppProtocol: http }
          Environment:
            - { Name: SCHOLIGHT_PUBLIC_WEB_URL, Value: !Sub "https://${DomainName}" }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref WebLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: web

  ApiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: sanchezcloud-scholight-api
      Cpu: "1024"
      Memory: "2048"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      RuntimePlatform: { CpuArchitecture: X86_64, OperatingSystemFamily: LINUX }
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt ApiTaskRole.Arn
      ContainerDefinitions:
        - Name: api
          Image: !Ref ApiImage
          Essential: true
          PortMappings:
            - { Name: api, ContainerPort: 8000, Protocol: tcp, AppProtocol: http }
          Environment:
            - { Name: SCHOLIGHT_PG_POOL_MIN_SIZE, Value: "2" }
            - { Name: SCHOLIGHT_PG_POOL_MAX_SIZE, Value: "8" }
            - { Name: SCHOLIGHT_SERVER_HOST, Value: 0.0.0.0 }
            - { Name: SCHOLIGHT_SERVER_PORT, Value: "8000" }
            - { Name: SCHOLIGHT_PROXY_HEADERS, Value: "true" }
            - { Name: SCHOLIGHT_FORWARDED_ALLOW_IPS, Value: !ImportValue sanchezcloud-production-vpc-cidr }
            - { Name: SCHOLIGHT_PUBLIC_WEB_URL, Value: !Sub "https://${DomainName}" }
            - { Name: SCHOLIGHT_CORS_ALLOW_ORIGINS, Value: !Sub '["https://${DomainName}"]' }
            - { Name: SCHOLIGHT_AUTH_REFRESH_COOKIE_SECURE, Value: "true" }
            - { Name: SCHOLIGHT_AVATAR_S3_BUCKET, Value: !Sub "sanchezcloud-account-avatars-${AWS::AccountId}-${AWS::Region}" }
            - { Name: SCHOLIGHT_EXTRACT_ENABLED, Value: "true" }
            - { Name: SCHOLIGHT_EXTRACT_SERVICE_URL, Value: "http://extract:8001" }
            - { Name: SCHOLIGHT_SURVEY_RUNTIME_ENABLED, Value: !Ref SurveyRuntimeEnabled }
            - { Name: SCHOLIGHT_SURVEY_PUBLIC_MODE, Value: !Ref SurveyPublicMode }
            - { Name: SCHOLIGHT_SURVEY_DRAFT_GLOBAL_CONCURRENCY, Value: "64" }
            - { Name: SCHOLIGHT_SURVEY_JOB_GLOBAL_CONCURRENCY, Value: "16" }
            - { Name: SCHOLIGHT_SURVEY_DRAFT_PER_USER_CONCURRENCY, Value: "8" }
            - { Name: SCHOLIGHT_SURVEY_JOB_PER_USER_CONCURRENCY, Value: "4" }
            - Name: SCHOLIGHT_SURVEY_S3_BUCKET
              Value: !ImportValue sanchezcloud-scholight-artifact-bucket-name
            - { Name: AWS_REGION, Value: !Ref AWS::Region }
            - { Name: AWS_DEFAULT_REGION, Value: !Ref AWS::Region }
          Secrets:
            - { Name: SCHOLIGHT_PG_HOST, ValueFrom: !Sub ["${Secret}:host::", { Secret: !ImportValue sanchezcloud-scholight-database-runtime-secret-arn }] }
            - { Name: SCHOLIGHT_PG_PORT, ValueFrom: !Sub ["${Secret}:port::", { Secret: !ImportValue sanchezcloud-scholight-database-runtime-secret-arn }] }
            - { Name: SCHOLIGHT_PG_DATABASE, ValueFrom: !Sub ["${Secret}:dbname::", { Secret: !ImportValue sanchezcloud-scholight-database-runtime-secret-arn }] }
            - { Name: SCHOLIGHT_PG_USER, ValueFrom: !Sub ["${Secret}:username::", { Secret: !ImportValue sanchezcloud-scholight-database-runtime-secret-arn }] }
            - { Name: SCHOLIGHT_PG_PASSWORD, ValueFrom: !Sub ["${Secret}:password::", { Secret: !ImportValue sanchezcloud-scholight-database-runtime-secret-arn }] }
            - { Name: SCHOLIGHT_AUTH_JWT_SECRET, ValueFrom: !Sub ["${Secret}:auth_jwt_secret::", { Secret: !ImportValue sanchezcloud-scholight-core-secret-arn }] }
            - { Name: SCHOLIGHT_ANONYMOUS_QUOTA_HMAC_SECRET, ValueFrom: !Sub ["${Secret}:anonymous_quota_hmac_secret::", { Secret: !ImportValue sanchezcloud-scholight-core-secret-arn }] }
            - { Name: SCHOLIGHT_ACCESS_KEY_HMAC_SECRET, ValueFrom: !Sub ["${Secret}:access_key_hmac_secret::", { Secret: !ImportValue sanchezcloud-scholight-core-secret-arn }] }
            - { Name: SCHOLIGHT_MCP_DELEGATION_JWT_SECRET, ValueFrom: !Sub ["${Secret}:mcp_delegation_jwt_secret::", { Secret: !ImportValue sanchezcloud-scholight-mcp-delegation-secret-arn }] }
            - { Name: SCHOLIGHT_EXTRACT_INTERNAL_TOKEN, ValueFrom: !Sub ["${Secret}:extract_internal_token::", { Secret: !ImportValue sanchezcloud-scholight-core-secret-arn }] }
            - { Name: SCHOLIGHT_SURVEY_MCP_JWT_SECRET, ValueFrom: !Sub ["${Secret}:survey_mcp_jwt_secret::", { Secret: !ImportValue sanchezcloud-scholight-core-secret-arn }] }
            - { Name: SCHOLIGHT_ZILLIZ_URI, ValueFrom: !Sub ["${Secret}:zilliz_uri::", { Secret: !ImportValue sanchezcloud-scholight-search-secret-arn }] }
            - { Name: SCHOLIGHT_ZILLIZ_TOKEN, ValueFrom: !Sub ["${Secret}:zilliz_token::", { Secret: !ImportValue sanchezcloud-scholight-search-secret-arn }] }
            - { Name: SCHOLIGHT_EMBEDDING_BASE_URL, ValueFrom: !Sub ["${Secret}:embedding_base_url::", { Secret: !ImportValue sanchezcloud-scholight-search-secret-arn }] }
            - { Name: SCHOLIGHT_EMBEDDING_API_KEY, ValueFrom: !Sub ["${Secret}:embedding_api_key::", { Secret: !ImportValue sanchezcloud-scholight-search-secret-arn }] }
            - { Name: SCHOLIGHT_EMBEDDING_MODEL, ValueFrom: !Sub ["${Secret}:embedding_model::", { Secret: !ImportValue sanchezcloud-scholight-search-secret-arn }] }
            - { Name: DEEPSEEK_API_KEY, ValueFrom: !Sub ["${Secret}:deepseek_api_key::", { Secret: !ImportValue sanchezcloud-scholight-survey-secret-arn }] }
            - { Name: SCHOLIGHT_ALIYUN_DM_ACCESS_KEY_ID, ValueFrom: !Sub ["${Secret}:aliyun_access_key_id::", { Secret: !ImportValue sanchezcloud-scholight-mail-secret-arn }] }
            - { Name: SCHOLIGHT_ALIYUN_DM_ACCESS_KEY_SECRET, ValueFrom: !Sub ["${Secret}:aliyun_access_key_secret::", { Secret: !ImportValue sanchezcloud-scholight-mail-secret-arn }] }
            - { Name: SCHOLIGHT_ALIYUN_DM_ACCOUNT_NAME, ValueFrom: !Sub ["${Secret}:aliyun_account_name::", { Secret: !ImportValue sanchezcloud-scholight-mail-secret-arn }] }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApiLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api

  ExtractTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: sanchezcloud-scholight-extract
      Cpu: "1024"
      Memory: "2048"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      RuntimePlatform: { CpuArchitecture: X86_64, OperatingSystemFamily: LINUX }
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      ContainerDefinitions:
        - Name: extract
          Image: !Ref ExtractImage
          Essential: true
          LinuxParameters: { InitProcessEnabled: true }
          PortMappings:
            - { Name: extract, ContainerPort: 8001, Protocol: tcp, AppProtocol: http }
          Environment:
            - { Name: SCHOLIGHT_EXTRACT_SERVER_HOST, Value: 0.0.0.0 }
            - { Name: SCHOLIGHT_EXTRACT_SERVER_PORT, Value: "8001" }
          Secrets:
            - { Name: SCHOLIGHT_EXTRACT_INTERNAL_TOKEN, ValueFrom: !Sub ["${Secret}:extract_internal_token::", { Secret: !ImportValue sanchezcloud-scholight-core-secret-arn }] }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ExtractLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: extract

  IngestTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: sanchezcloud-scholight-ingest
      Cpu: "1024"
      Memory: "2048"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      RuntimePlatform: { CpuArchitecture: X86_64, OperatingSystemFamily: LINUX }
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      ContainerDefinitions:
        - Name: ingest
          Image: !Ref IngestImage
          Essential: true
          StopTimeout: 120
          Command: [scholight, scheduler, drain-ingest]
          Environment:
            - { Name: SCHOLIGHT_PG_POOL_MIN_SIZE, Value: "1" }
            - { Name: SCHOLIGHT_PG_POOL_MAX_SIZE, Value: "4" }
          Secrets:
            - { Name: SCHOLIGHT_PG_HOST, ValueFrom: !Sub ["${Secret}:host::", { Secret: !ImportValue sanchezcloud-scholight-database-runtime-secret-arn }] }
            - { Name: SCHOLIGHT_PG_PORT, ValueFrom: !Sub ["${Secret}:port::", { Secret: !ImportValue sanchezcloud-scholight-database-runtime-secret-arn }] }
