            - { Name: SCHOLIGHT_SURVEY_JOB_GLOBAL_CONCURRENCY, Value: "16" }
            - { Name: SCHOLIGHT_SURVEY_JOB_PER_USER_CONCURRENCY, Value: "4" }
            - { Name: SCHOLIGHT_SURVEY_JOB_WORKER_CONCURRENCY, Value: "2" }
            - { Name: SCHOLIGHT_SURVEY_PROVIDER_MAX_ATTEMPTS, Value: "3" }
            - { Name: SCHOLIGHT_SURVEY_PROVIDER_RETRY_BASE_SECONDS, Value: "2" }
            - { Name: SCHOLIGHT_SURVEY_PROVIDER_RETRY_MAX_SECONDS, Value: "30" }
