  SurveyService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: scholight-survey
      Cluster: !ImportValue sanchezcloud-production-cluster-arn
      TaskDefinition: !Ref SurveyTaskDefinition
      DesiredCount: !If [RunSurveyWorkers, 1, 0]
      LaunchType: FARGATE
      PlatformVersion: LATEST
      DeploymentConfiguration: { MinimumHealthyPercent: 100, MaximumPercent: 200 }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups: [!Ref TaskSecurityGroup]
          Subnets:
            - !ImportValue sanchezcloud-production-private-subnet-1
            - !ImportValue sanchezcloud-production-private-subnet-2
      ServiceConnectConfiguration:
        Enabled: true
        Namespace: !ImportValue sanchezcloud-production-namespace-arn
      PropagateTags: SERVICE
      EnableExecuteCommand: false

  ApiScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Condition: RunApplication
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      MinCapacity: 1
      MaxCapacity: 4
      ResourceId: !Join [/, [service, !ImportValue sanchezcloud-production-cluster-name, !GetAtt ApiService.Name]]

  ApiCpuScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Condition: RunApplication
    Properties:
      PolicyName: scholight-api-cpu
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ApiScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 60
        ScaleInCooldown: 300
        ScaleOutCooldown: 60
        PredefinedMetricSpecification: { PredefinedMetricType: ECSServiceAverageCPUUtilization }

  ApiMemoryScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Condition: RunApplication
    Properties:
      PolicyName: scholight-api-memory
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ApiScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 70
        ScaleInCooldown: 300
        ScaleOutCooldown: 60
        PredefinedMetricSpecification: { PredefinedMetricType: ECSServiceAverageMemoryUtilization }

  ExtractScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Condition: RunApplication
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      MinCapacity: 1
      MaxCapacity: 3
      ResourceId: !Join [/, [service, !ImportValue sanchezcloud-production-cluster-name, !GetAtt ExtractService.Name]]

  ExtractCpuScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Condition: RunApplication
    Properties:
      PolicyName: scholight-extract-cpu
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ExtractScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 60
        ScaleInCooldown: 300
        ScaleOutCooldown: 60
        PredefinedMetricSpecification: { PredefinedMetricType: ECSServiceAverageCPUUtilization }

  ExtractMemoryScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Condition: RunApplication
    Properties:
      PolicyName: scholight-extract-memory
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ExtractScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 70
        ScaleInCooldown: 300
        ScaleOutCooldown: 60
        PredefinedMetricSpecification: { PredefinedMetricType: ECSServiceAverageMemoryUtilization }

  SurveyDraftScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Condition: RunSurveyWorkers
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      MinCapacity: 1
      MaxCapacity: !Ref SurveyDraftMaxTasks
      ResourceId: !Join [/, [service, !ImportValue sanchezcloud-production-cluster-name, !GetAtt SurveyDraftService.Name]]

  SurveyDraftBacklogScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Condition: RunSurveyWorkers
    Properties:
      PolicyName: scholight-survey-draft-backlog-per-task
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref SurveyDraftScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 8
        ScaleInCooldown: 900
        ScaleOutCooldown: 60
        CustomizedMetricSpecification:
          Metrics:
            - Id: outstanding
              MetricStat:
                Metric:
                  Namespace: Scholight/Production
                  MetricName: SurveyDraftOutstanding
                  Dimensions: [{ Name: service, Value: survey-draft-worker }]
                Stat: Average
              ReturnData: false
            - Id: running_tasks
              MetricStat:
                Metric:
                  Namespace: ECS/ContainerInsights
                  MetricName: RunningTaskCount
                  Dimensions:
                    - { Name: ClusterName, Value: !ImportValue sanchezcloud-production-cluster-name }
                    - { Name: ServiceName, Value: !GetAtt SurveyDraftService.Name }
                Stat: Average
              ReturnData: false
            - Id: backlog_per_task
              Expression: IF(running_tasks>0,outstanding/running_tasks,outstanding)
              Label: Draft outstanding work per running task
              ReturnData: true

  SurveyFullScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Condition: RunSurveyWorkers
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      MinCapacity: 1
      MaxCapacity: !Ref SurveyFullMaxTasks
      ResourceId: !Join [/, [service, !ImportValue sanchezcloud-production-cluster-name, !GetAtt SurveyService.Name]]

  SurveyFullBacklogScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Condition: RunSurveyWorkers
    Properties:
      PolicyName: scholight-survey-full-backlog-per-task
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref SurveyFullScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 2
        ScaleInCooldown: 900
        ScaleOutCooldown: 60
        CustomizedMetricSpecification:
          Metrics:
            - Id: outstanding
              MetricStat:
                Metric:
                  Namespace: Scholight/Production
                  MetricName: SurveyJobOutstanding
                  Dimensions: [{ Name: service, Value: survey-full-worker }]
                Stat: Average
              ReturnData: false
            - Id: running_tasks
              MetricStat:
                Metric:
                  Namespace: ECS/ContainerInsights
                  MetricName: RunningTaskCount
                  Dimensions:
                    - { Name: ClusterName, Value: !ImportValue sanchezcloud-production-cluster-name }
                    - { Name: ServiceName, Value: !GetAtt SurveyService.Name }
                Stat: Average
              ReturnData: false
            - Id: backlog_per_task
              Expression: IF(running_tasks>0,outstanding/running_tasks,outstanding)
              Label: Full Survey outstanding work per running task
              ReturnData: true

  IngestSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: sanchezcloud-scholight-ingest
      Description: Drain pending paper ingestion work every two hours
      FlexibleTimeWindow: { Mode: "OFF" }
      ScheduleExpression: rate(2 hours)
      State: !If [RunApplication, !Ref SchedulerState, DISABLED]
      Target:
        Arn: !ImportValue sanchezcloud-production-cluster-arn
        RoleArn: !GetAtt SchedulerRole.Arn
        EcsParameters:
          TaskDefinitionArn: !Ref IngestTaskDefinition
          LaunchType: FARGATE
          PlatformVersion: LATEST
          TaskCount: 1
          NetworkConfiguration:
            AwsvpcConfiguration:
              AssignPublicIp: DISABLED
              SecurityGroups: [!Ref TaskSecurityGroup]
              Subnets:
                - !ImportValue sanchezcloud-production-private-subnet-1
                - !ImportValue sanchezcloud-production-private-subnet-2
        RetryPolicy: { MaximumEventAgeInSeconds: 3600, MaximumRetryAttempts: 1 }

  MetadataSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: sanchezcloud-scholight-metadata-sync
      Description: Discover daily arXiv changes and enqueue exact versions
      FlexibleTimeWindow: { Mode: "OFF" }
      ScheduleExpression: cron(0 8 * * ? *)
      ScheduleExpressionTimezone: UTC
      State: !If [RunApplication, !Ref SchedulerState, DISABLED]
      Target:
        Arn: !ImportValue sanchezcloud-production-cluster-arn
        RoleArn: !GetAtt SchedulerRole.Arn
        EcsParameters:
          TaskDefinitionArn: !Ref MetadataTaskDefinition
          LaunchType: FARGATE
          PlatformVersion: LATEST
          TaskCount: 1
          NetworkConfiguration:
            AwsvpcConfiguration:
              AssignPublicIp: DISABLED
              SecurityGroups: [!Ref TaskSecurityGroup]
              Subnets:
                - !ImportValue sanchezcloud-production-private-subnet-1
                - !ImportValue sanchezcloud-production-private-subnet-2
        RetryPolicy: { MaximumEventAgeInSeconds: 3600, MaximumRetryAttempts: 1 }

  ApiUnhealthyAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: RunApplication
    Properties:
      AlarmName: sanchezcloud-scholight-api-unhealthy
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - { Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName }
        - { Name: TargetGroup, Value: !GetAtt ApiTargetGroup.TargetGroupFullName }
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!ImportValue sanchezcloud-scholight-alert-topic-arn]

  ApiFiveHundredAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: RunApplication
    Properties:
      AlarmName: sanchezcloud-scholight-api-5xx
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - { Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName }
        - { Name: TargetGroup, Value: !GetAtt ApiTargetGroup.TargetGroupFullName }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!ImportValue sanchezcloud-scholight-alert-topic-arn]

  ApiLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: RunApplication
    Properties:
      AlarmName: sanchezcloud-scholight-api-p95-latency
