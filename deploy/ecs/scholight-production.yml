  WebService:
    Type: AWS::ECS::Service
    DependsOn: HttpsListener
    Properties:
      ServiceName: scholight-web
      Cluster: !ImportValue sanchezcloud-production-cluster-arn
      TaskDefinition: !Ref WebTaskDefinition
      DesiredCount: !If [RunApplication, 1, 0]
      LaunchType: FARGATE
      PlatformVersion: LATEST
      HealthCheckGracePeriodSeconds: 30
      DeploymentConfiguration: { MinimumHealthyPercent: 100, MaximumPercent: 200 }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups: [!Ref TaskSecurityGroup]
          Subnets:
            - !ImportValue sanchezcloud-production-private-subnet-1
            - !ImportValue sanchezcloud-production-private-subnet-2
      LoadBalancers:
        - { ContainerName: web, ContainerPort: 8080, TargetGroupArn: !Ref WebTargetGroup }
      ServiceConnectConfiguration:
        Enabled: true
        Namespace: !ImportValue sanchezcloud-production-namespace-arn
      PropagateTags: SERVICE
      EnableExecuteCommand: false

  ApiService:
    Type: AWS::ECS::Service
    DependsOn: ApiListenerRule
    Properties:
      ServiceName: scholight-api
      Cluster: !ImportValue sanchezcloud-production-cluster-arn
      TaskDefinition: !Ref ApiTaskDefinition
      DesiredCount: !If [RunApplication, 1, 0]
      LaunchType: FARGATE
      PlatformVersion: LATEST
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration: { MinimumHealthyPercent: 100, MaximumPercent: 200 }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups: [!Ref TaskSecurityGroup]
          Subnets:
            - !ImportValue sanchezcloud-production-private-subnet-1
            - !ImportValue sanchezcloud-production-private-subnet-2
      LoadBalancers:
        - { ContainerName: api, ContainerPort: 8000, TargetGroupArn: !Ref ApiTargetGroup }
      ServiceConnectConfiguration:
        Enabled: true
        Namespace: !ImportValue sanchezcloud-production-namespace-arn
        Services:
          - PortName: api
            DiscoveryName: api
            ClientAliases: [{ DnsName: api, Port: 8000 }]
      PropagateTags: SERVICE
      EnableExecuteCommand: false

  ExtractService:
