    Condition: RunSurveyWorkers
    Properties:
      AlarmName: sanchezcloud-scholight-survey-finalization-failure
      Namespace: Scholight/Production
      MetricName: SurveyFinalizationFailure
      Dimensions: [{ Name: service, Value: survey-worker }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!ImportValue sanchezcloud-scholight-alert-topic-arn]

  SurveyReadablePublicationRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: RunSurveyWorkers
    Properties:
      AlarmName: sanchezcloud-scholight-survey-readable-publication-rate
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 1
      Threshold: 20
      TreatMissingData: notBreaching
      Metrics:
        - Id: succeeded
          MetricStat:
            Metric:
              Namespace: Scholight/Production
              MetricName: SurveyPublicationCount
              Dimensions:
                - { Name: service, Value: survey-worker }
                - { Name: outcome, Value: succeeded }
            Period: 21600
            Stat: Sum
          ReturnData: false
        - Id: degraded
          MetricStat:
            Metric:
              Namespace: Scholight/Production
              MetricName: SurveyPublicationCount
              Dimensions:
                - { Name: service, Value: survey-worker }
                - { Name: outcome, Value: degraded }
            Period: 21600
            Stat: Sum
          ReturnData: false
        - Id: failed
          MetricStat:
            Metric:
              Namespace: Scholight/Production
              MetricName: SurveyPublicationCount
              Dimensions:
                - { Name: service, Value: survey-worker }
                - { Name: outcome, Value: failed }
            Period: 21600
            Stat: Sum
          ReturnData: false
        - Id: failure_rate
          Expression: IF((FILL(succeeded,0)+FILL(degraded,0)+FILL(failed,0))>=3,100*FILL(failed,0)/(FILL(succeeded,0)+FILL(degraded,0)+FILL(failed,0)),0)
          Label: Unreadable Survey publication percentage
          ReturnData: true
      AlarmActions: [!ImportValue sanchezcloud-scholight-alert-topic-arn]

