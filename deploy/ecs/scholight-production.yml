      AlarmName: sanchezcloud-scholight-survey-image-generation-failure
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      Threshold: 3
      TreatMissingData: notBreaching
      Metrics:
        - Id: failed
          MetricStat:
            Metric:
              Namespace: Scholight/Production
              MetricName: SurveyImageGenerationCount
              Dimensions:
                - { Name: service, Value: survey-full-worker }
                - { Name: outcome, Value: failed }
            Period: 21600
            Stat: Sum
          ReturnData: false
        - Id: succeeded
          MetricStat:
            Metric:
              Namespace: Scholight/Production
              MetricName: SurveyImageGenerationCount
              Dimensions:
                - { Name: service, Value: survey-full-worker }
                - { Name: outcome, Value: succeeded }
            Period: 21600
            Stat: Sum
          ReturnData: false
        - Id: all_failed
          Expression: IF((failed+succeeded)>=3,IF(succeeded==0,failed,0),0)
          Label: Image generations failed with no successes
          ReturnData: true
      AlarmActions: [!ImportValue sanchezcloud-scholight-alert-topic-arn]

