name: scholight-archive-test

x-milvus: &milvus
  image: milvusdb/milvus:v2.6.0@sha256:13bb2bff4b20598e860ee95ad1f42a167d20f50d9acc9718b09bf34792bb8f10
  command: milvus run standalone
  environment:
    DEPLOY_MODE: STANDALONE
    ETCD_USE_EMBED: "true"
    ETCD_DATA_DIR: /var/lib/milvus/etcd
    ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
    COMMON_STORAGETYPE: local
  volumes:
    - ./embedEtcd.yaml:/milvus/configs/embedEtcd.yaml:ro
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
    interval: 5s
    timeout: 3s
    retries: 40
    start_period: 30s

services:
  source:
    <<: *milvus
    ports: ["127.0.0.1:7253:19530"]
  target:
    <<: *milvus
    ports: ["127.0.0.1:7254:19530"]
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data
    environment:
      MINIO_ROOT_USER: archive-test
      MINIO_ROOT_PASSWORD: archive-test-only
      MINIO_KMS_SECRET_KEY: archive-test:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    ports: ["127.0.0.1:7290:9000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
