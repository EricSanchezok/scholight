name: scholight-survey-e2e

x-runtime-environment: &runtime-environment
  SCHOLIGHT_DISABLE_DOTENV: "1"
  SCHOLIGHT_PG_HOST: postgres
  SCHOLIGHT_PG_PORT: "5432"
  SCHOLIGHT_PG_DATABASE: survey_e2e
  SCHOLIGHT_PG_USER: postgres
  SCHOLIGHT_PG_PASSWORD: survey-local-only
  SCHOLIGHT_PG_SSL_ROOT_CERT: disable
  SCHOLIGHT_PG_POOL_MIN_SIZE: "1"
  SCHOLIGHT_PG_POOL_MAX_SIZE: "12"
  SCHOLIGHT_AUTH_JWT_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  SCHOLIGHT_ANONYMOUS_QUOTA_HMAC_SECRET: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
  SCHOLIGHT_ACCESS_KEY_HMAC_SECRET: cccccccccccccccccccccccccccccccc
  SCHOLIGHT_MCP_DELEGATION_JWT_SECRET: dddddddddddddddddddddddddddddddd
  SCHOLIGHT_SURVEY_MCP_JWT_SECRET: eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
  SCHOLIGHT_ZILLIZ_URI: http://zilliz.invalid
  SCHOLIGHT_ZILLIZ_TOKEN: e2e-not-a-secret
  SCHOLIGHT_EMBEDDING_BASE_URL: http://embedding.invalid/v1
  SCHOLIGHT_EMBEDDING_API_KEY: e2e-not-a-secret
  SCHOLIGHT_SURVEY_ENABLED: "true"
  SCHOLIGHT_SURVEY_S3_BUCKET: scholight-survey-e2e
  SCHOLIGHT_SURVEY_S3_ENDPOINT_URL: http://minio:9000
  SCHOLIGHT_SURVEY_DAILY_LIMIT: "5"
  SCHOLIGHT_SURVEY_DRAFT_TIMEOUT_SECONDS: "120"
  SCHOLIGHT_SURVEY_JOB_TIMEOUT_SECONDS: "120"
  SCHOLIGHT_SURVEY_DRAFT_CONCURRENCY: "8"
  SCHOLIGHT_SURVEY_JOB_CONCURRENCY: "2"
  SCHOLIGHT_SURVEY_DRAFT_PER_USER_CONCURRENCY: "2"
  SCHOLIGHT_SURVEY_JOB_PER_USER_CONCURRENCY: "1"
  SCHOLIGHT_SURVEY_HEARTBEAT_SECONDS: "5"
  SCHOLIGHT_SURVEY_LEASE_SECONDS: "30"
  SCHOLIGHT_PUBLIC_WEB_URL: http://e2e.local
  SCHOLIGHT_CORS_ALLOW_ORIGINS: '["http://e2e.local"]'
  SCHOLIGHT_SERVER_HOST: 0.0.0.0
  SCHOLIGHT_SERVER_PORT: "8000"
  DEEPSEEK_API_KEY: e2e-model-key
  SCHOLIGHT_SURVEY_TITLE_API_URL: http://model:8080/v1/chat/completions
  IMAGE_GEN_API_KEY: e2e-image-key
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin
  AWS_REGION: ap-southeast-1
  AWS_DEFAULT_REGION: ap-southeast-1

services:
  postgres:
    image: postgres:16.9-bookworm@sha256:253815cf7579ffa05e1673d92e78d37273e61be0e4414e9a1449337d7925be94
    environment:
      POSTGRES_DB: survey_e2e
      POSTGRES_PASSWORD: survey-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d survey_e2e"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    tmpfs:
      - /data

  model:
    image: scholight-survey-e2e:ci
    command:
      - /app/.venv/bin/uvicorn
      - survey_e2e.fake_model:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"

  api:
    image: scholight-survey-e2e:ci
    environment: *runtime-environment
    command:
      - /app/.venv/bin/uvicorn
      - survey_e2e.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      model:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/livez', timeout=2)"
      interval: 1s
      timeout: 3s
      retries: 60

  survey-draft-worker:
    image: scholight-survey-e2e:ci
    environment: *runtime-environment
    command: ["/app/.venv/bin/scholight", "survey", "serve-draft-worker"]
    depends_on:
      api:
        condition: service_healthy

  survey-worker:
    image: scholight-survey-e2e:ci
    environment: *runtime-environment
    command: ["/app/.venv/bin/scholight", "survey", "serve-worker"]
    depends_on:
      api:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - survey-data:/data

  driver:
    image: scholight-survey-e2e:ci
    environment: *runtime-environment
    command: ["/app/.venv/bin/python", "-m", "survey_e2e.driver"]
    depends_on:
      survey-draft-worker:
        condition: service_started
      survey-worker:
        condition: service_started
      minio:
        condition: service_started

volumes:
  survey-data:
