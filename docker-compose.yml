# Scholight remote deployment
#
# Build uses an immutable cloud-auth Git revision declared in the Dockerfile.
# Cloud-auth and Scholight migrations are explicit, ordered, and never run by API startup:
#   docker compose --env-file .env --profile migrate run --rm migrate
#
# The API binds to loopback by default. Put a reverse proxy on the same host and
# do not route /livez or /readyz publicly. If proxy headers are enabled, set the
# exact proxy IP/subnet in SCHOLIGHT_FORWARDED_ALLOW_IPS; never use '*'.
#
# Start API and optional scheduler workers:
#   docker compose --env-file .env up -d api
#   docker compose --env-file .env --profile scheduler up -d pdf-daemon md-daemon chunk-daemon

x-image: &scholight-image
  image: ${SCHOLIGHT_IMAGE:-scholight:0.1.0}
  build:
    context: .
    secrets:
      - github_token
    dockerfile: docker/scholight-api/Dockerfile

x-common-environment: &common-environment
  SCHOLIGHT_LOG_LEVEL: ${SCHOLIGHT_LOG_LEVEL:-INFO}
  SCHOLIGHT_DATA_ROOT: /data
  SCHOLIGHT_ZILLIZ_URI: ${SCHOLIGHT_ZILLIZ_URI:-}
  SCHOLIGHT_ZILLIZ_TOKEN: ${SCHOLIGHT_ZILLIZ_TOKEN:-}

x-scheduler-service: &scheduler-service
  <<: *scholight-image
  profiles: ["scheduler"]
  restart: unless-stopped
  volumes:
    - scholight-data:/data
  healthcheck:
    disable: true

services:
  frontend:
    image: ${SCHOLIGHT_FRONTEND_IMAGE:-scholight-frontend:0.1.0}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "${SCHOLIGHT_BIND_ADDRESS:-127.0.0.1}:${SCHOLIGHT_FRONTEND_PORT:-3000}:8080"
    networks:
      scholight:
        ipv4_address: 172.30.0.10
    restart: unless-stopped

  api:
    <<: *scholight-image
    environment:
      <<: *common-environment
      SCHOLIGHT_SERVER_HOST: 0.0.0.0
      SCHOLIGHT_SERVER_PORT: "8000"
      SCHOLIGHT_PROXY_HEADERS: ${SCHOLIGHT_PROXY_HEADERS:-false}
      SCHOLIGHT_FORWARDED_ALLOW_IPS: ${SCHOLIGHT_FORWARDED_ALLOW_IPS:-127.0.0.1,172.30.0.10}
      SCHOLIGHT_ANONYMOUS_RATE_LIMIT_PER_MINUTE: ${SCHOLIGHT_ANONYMOUS_RATE_LIMIT_PER_MINUTE:-30}
      SCHOLIGHT_ANONYMOUS_STANDARD_DAILY_LIMIT: ${SCHOLIGHT_ANONYMOUS_STANDARD_DAILY_LIMIT:-100}
      SCHOLIGHT_ANONYMOUS_THOROUGH_DAILY_LIMIT: ${SCHOLIGHT_ANONYMOUS_THOROUGH_DAILY_LIMIT:-30}
      SCHOLIGHT_ANONYMOUS_QUOTA_HMAC_SECRET: ${SCHOLIGHT_ANONYMOUS_QUOTA_HMAC_SECRET:?SCHOLIGHT_ANONYMOUS_QUOTA_HMAC_SECRET is required}
      SCHOLIGHT_ACCESS_KEY_HMAC_SECRET: ${SCHOLIGHT_ACCESS_KEY_HMAC_SECRET:?SCHOLIGHT_ACCESS_KEY_HMAC_SECRET is required}
      SCHOLIGHT_PG_HOST: ${SCHOLIGHT_PG_HOST:-}
      SCHOLIGHT_PG_PORT: ${SCHOLIGHT_PG_PORT:-5432}
      SCHOLIGHT_PG_DATABASE: ${SCHOLIGHT_PG_DATABASE:-postgres}
      SCHOLIGHT_PG_USER: ${SCHOLIGHT_PG_USER:-postgres}
      SCHOLIGHT_PG_PASSWORD: ${SCHOLIGHT_PG_PASSWORD:-}
      SCHOLIGHT_PG_SSL_ROOT_CERT: /etc/ssl/certs/global-bundle.pem
      SCHOLIGHT_PG_POOL_MIN_SIZE: ${SCHOLIGHT_PG_POOL_MIN_SIZE:-5}
      SCHOLIGHT_PG_POOL_MAX_SIZE: ${SCHOLIGHT_PG_POOL_MAX_SIZE:-20}
      SCHOLIGHT_AUTH_JWT_SECRET: ${SCHOLIGHT_AUTH_JWT_SECRET:?SCHOLIGHT_AUTH_JWT_SECRET is required}
      SCHOLIGHT_JWT_ACCESS_TOKEN_TTL_MINUTES: ${SCHOLIGHT_JWT_ACCESS_TOKEN_TTL_MINUTES:-15}
      SCHOLIGHT_JWT_REFRESH_TOKEN_TTL_DAYS: ${SCHOLIGHT_JWT_REFRESH_TOKEN_TTL_DAYS:-7}
      SCHOLIGHT_ACCOUNT_LOCKOUT_THRESHOLD: ${SCHOLIGHT_ACCOUNT_LOCKOUT_THRESHOLD:-5}
      SCHOLIGHT_ACCOUNT_LOCKOUT_DURATION_MINUTES: ${SCHOLIGHT_ACCOUNT_LOCKOUT_DURATION_MINUTES:-15}
      SCHOLIGHT_ALIYUN_DM_ACCESS_KEY_ID: ${SCHOLIGHT_ALIYUN_DM_ACCESS_KEY_ID:-}
      SCHOLIGHT_ALIYUN_DM_ACCESS_KEY_SECRET: ${SCHOLIGHT_ALIYUN_DM_ACCESS_KEY_SECRET:-}
      SCHOLIGHT_ALIYUN_DM_ACCOUNT_NAME: ${SCHOLIGHT_ALIYUN_DM_ACCOUNT_NAME:-}
      SCHOLIGHT_ALIYUN_DM_FROM_ALIAS: ${SCHOLIGHT_ALIYUN_DM_FROM_ALIAS:-Scholight}
      SCHOLIGHT_ALIYUN_DM_REPLY_TO_ADDRESS: ${SCHOLIGHT_ALIYUN_DM_REPLY_TO_ADDRESS:-true}
      SCHOLIGHT_EMBEDDING_BASE_URL: ${SCHOLIGHT_EMBEDDING_BASE_URL:-}
      SCHOLIGHT_EMBEDDING_API_KEY: ${SCHOLIGHT_EMBEDDING_API_KEY:-}
      SCHOLIGHT_EMBEDDING_MODEL: ${SCHOLIGHT_EMBEDDING_MODEL:-}
      SCHOLIGHT_CORS_ALLOW_ORIGINS: ${SCHOLIGHT_CORS_ALLOW_ORIGINS:-[]}
      SCHOLIGHT_SEARCH_ENRICHMENT_RPC_TIMEOUT_SECONDS: ${SCHOLIGHT_SEARCH_ENRICHMENT_RPC_TIMEOUT_SECONDS:-1.5}
      SCHOLIGHT_SEARCH_LEVEL2_RPC_TIMEOUT_SECONDS: ${SCHOLIGHT_SEARCH_LEVEL2_RPC_TIMEOUT_SECONDS:-45.0}
      SCHOLIGHT_SEARCH_LEVEL2_TIMEOUT_SECONDS: ${SCHOLIGHT_SEARCH_LEVEL2_TIMEOUT_SECONDS:-60.0}
    ports:
      - "${SCHOLIGHT_BIND_ADDRESS:-127.0.0.1}:${SCHOLIGHT_HOST_PORT:-8000}:8000"
    restart: unless-stopped
    networks:
      - scholight

  migrate:
    <<: *scholight-image
    profiles: ["migrate"]
    command: ["/app/.venv/bin/scholight", "store", "migrate"]
    environment:
      SCHOLIGHT_LOG_LEVEL: ${SCHOLIGHT_LOG_LEVEL:-INFO}
      SCHOLIGHT_PG_HOST: ${SCHOLIGHT_PG_HOST:-}
      SCHOLIGHT_PG_PORT: ${SCHOLIGHT_PG_PORT:-5432}
      SCHOLIGHT_PG_DATABASE: ${SCHOLIGHT_PG_DATABASE:-postgres}
      SCHOLIGHT_PG_USER: ${SCHOLIGHT_PG_USER:-postgres}
      SCHOLIGHT_PG_PASSWORD: ${SCHOLIGHT_PG_PASSWORD:-}
      SCHOLIGHT_PG_SSL_ROOT_CERT: /etc/ssl/certs/global-bundle.pem
      SCHOLIGHT_MIGRATIONS_DIR: /app/migrations
      AUTH_MIGRATIONS_DIR: /app/cloud-auth/migrations
    restart: "no"
    healthcheck:
      disable: true

  paper-sync:
    <<: *scheduler-service
    command: ["/app/.venv/bin/scholight", "scheduler", "paper-sync"]
    environment:
      <<: *common-environment
      SCHOLIGHT_EMBEDDING_BASE_URL: ${SCHOLIGHT_EMBEDDING_BASE_URL:-}
      SCHOLIGHT_EMBEDDING_API_KEY: ${SCHOLIGHT_EMBEDDING_API_KEY:-}
      SCHOLIGHT_EMBEDDING_MODEL: ${SCHOLIGHT_EMBEDDING_MODEL:-}
    restart: "no"

  pdf-daemon:
    <<: *scheduler-service
    command: ["/app/.venv/bin/scholight", "scheduler", "pdf-daemon"]
    environment:
      <<: *common-environment

  md-daemon:
    <<: *scheduler-service
    command: ["/app/.venv/bin/scholight", "scheduler", "md-daemon"]
    environment:
      <<: *common-environment

  chunk-daemon:
    <<: *scheduler-service
    command: ["/app/.venv/bin/scholight", "scheduler", "chunk-daemon"]
    environment:
      <<: *common-environment
      SCHOLIGHT_EMBEDDING_BASE_URL: ${SCHOLIGHT_EMBEDDING_BASE_URL:-}
      SCHOLIGHT_EMBEDDING_API_KEY: ${SCHOLIGHT_EMBEDDING_API_KEY:-}
      SCHOLIGHT_EMBEDDING_MODEL: ${SCHOLIGHT_EMBEDDING_MODEL:-}

secrets:
  github_token:
    environment: GH_TOKEN

volumes:
  scholight-data:

networks:
  scholight:
    ipam:
      config:
        - subnet: 172.30.0.0/24
