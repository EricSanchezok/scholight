# Scholight — API Server
# =============================
# Single-container deployment.  All databases (Zilliz Cloud, AWS RDS PG)
# are external services configured via environment variables.
# The daily arXiv sync daemons run on the host — NEVER in this container.
#
# Quick start:
#   1. cp .env.production.example .env.production
#   2. Fill in the empty values in .env.production
#   3. docker compose --env-file .env.production build
#   4. docker compose --env-file .env.production up -d

services:
  api:
    build:
      context: .
      dockerfile: docker/scholight-api/Dockerfile
    image: scholight-api:latest
    container_name: scholight-api
    ports:
      - "${SCHOLIGHT_SERVER_PORT:-8000}:8000"
    env_file:
      - .env.production
    restart: unless-stopped
    # No volumes — the API never touches local disk.
    # No depends_on — Zilliz and PG are external services.
